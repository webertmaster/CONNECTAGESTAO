/* ============ DB ============ */

      {id:id(),nome:'Ana Costa',nascimento:'2013-11-30',turmaId:DB.turmas.all()[2].id,horario:'Sex 16h',responsavel:'Márcia Costa',telefone:'5511955554444',valor:220,status:'inativo',dataCadastro:hoje.toISOString(),vencimentoDia:5}

function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtBRL(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('pt-BR'); }
function fmtDateTime(d){ if(!d) return '—'; return new Date(d).toLocaleString('pt-BR'); }

function calcularMedias(alunoId){
  const notas = DB.notas.all().filter(n=>n.alunoId===alunoId);
  const porDisc = {};
  notas.forEach(n=>{
    if(!porDisc[n.disciplina]) porDisc[n.disciplina] = {1:[],2:[],3:[]};
    if(porDisc[n.disciplina][n.trimestre]) porDisc[n.disciplina][n.trimestre].push(n.nota);
  });
  const res = {};
  Object.keys(porDisc).forEach(d=>{
    res[d] = {};
    [1,2,3].forEach(tri=>{
      const arr = porDisc[d][tri]||[];
      res[d][tri] = arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
    });
    const todas = Object.values(res[d]);
    res[d].media = todas.reduce((a,b)=>a+b,0)/todas.length;
  });
  return res;
}

function calcularFrequencia(alunoId){
  const freqs = DB.frequencias.all().filter(f=>f.alunoId===alunoId);
  const total = freqs.length;
  const presentes = freqs.filter(f=>f.status==='presente').length;
  const faltas = freqs.filter(f=>f.status==='falta').length;
  const justificadas = freqs.filter(f=>f.status==='justificada').length;
  const percentual = total ? (presentes/total)*100 : 100;
  return {total,presentes,faltas,justificadas,percentual};
}

function getTarefasAluno(alunoId){
  const aluno = DB.alunos.all().find(a=>a.id===alunoId);
  if(!aluno) return [];
  return DB.tarefas.all().filter(t=>t.status==='ativa' && (t.turmaId===aluno.turmaId || t.alunosIds.includes(alunoId)));
}

/* ============ NAV ============ */
const pages = {

  turmas:renderTurmas, comunicados:renderComunicados, financeiro:renderFinanceiro,
  automacao:renderAutomacao, relatorios:renderRelatorios, notas:renderNotas,
  frequencia:renderFrequencia, tarefas:renderTarefas, portfolio:renderPortfolio

  dashboard:'Dashboard',alunos:'Alunos',pagamentos:'Pagamentos',
  turmas:'Turmas',comunicados:'Comunicados',financeiro:'Financeiro',
  automacao:'Automação WhatsApp',relatorios:'Relatórios',notas:'Desempenho',
  frequencia:'Frequência',tarefas:'Tarefas',portfolio:'Portfólio de Provas e Trabalhos'

function go(page){
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  document.getElementById('pageTitle').textContent = titles[page];
  const c = document.getElementById('content');
  c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in');
  pages[page]();
  if(window.innerWidth<1024) document.getElementById('sidebar').classList.add('-translate-x-full');
  lucide.createIcons();
}
document.querySelectorAll('.sidebar-link').forEach(l=>l.addEventListener('click',()=>go(l.dataset.page)));
document.getElementById('btnMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('-translate-x-full'));

const btnDark = document.getElementById('btnDark');
if(localStorage.getItem('edu_dark')==='1') document.documentElement.classList.add('dark');
btnDark.addEventListener('click',()=>{
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('edu_dark', document.documentElement.classList.contains('dark')?'1':'0');
  lucide.createIcons();
});

function openModal(title, html){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
  lucide.createIcons();
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
function toast(msg, type='success'){
  const t = document.getElementById('toast');
  const icon = type==='success'?'check-circle':type==='error'?'alert-circle':'info';
  t.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${msg}</span>`;
  t.classList.remove('hidden');
  lucide.createIcons();
  setTimeout(()=>t.classList.add('hidden'),3000);
}

    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">

function formAluno(editId){
  const turmas = DB.turmas.all();

            <option value="ativo" ${a.status==='ativo'?'selected':''}>Ativo</option>
            <option value="inativo" ${a.status==='inativo'?'selected':''}>Inativo</option>
          </select></div>
        <div><label class="text-xs font-semibold">Turma</label>
          <select name="turmaId" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
            <option value="">Selecione...</option>
            ${turmas.map(t=>`<option value="${t.id}" ${a.turmaId===t.id?'selected':''}>${t.nome} — ${t.horario}</option>`).join('')}
          </select>
          ${turmasSugestao.length?`<p class="text-xs text-emerald-600 mt-1"><i data-lucide="sparkles" class="w-3 h-3 inline"></i> Sugestões: ${turmasSugestao.map(t=>`<b>${t.nome}</b> (${t.vagas} vagas)`).join(', ')}</p>`:''}
        </div>
        <div><label class="text-xs font-semibold">Horário</label>
          <input name="horario" value="${a.horario||''}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
        <div><label class="text-xs font-semibold">Responsável</label>
          <input name="responsavel" required value="${a.responsavel||''}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
        <div><label class="text-xs font-semibold">Telefone/WhatsApp</label>
          <input name="telefone" required value="${a.telefone||''}" placeholder="5511999999999" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
        <div><label class="text-xs font-semibold">Valor da mensalidade (R$)</label>
          <input type="number" step="0.01" name="valor" required value="${a.valor||''}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>

          <input type="number" min="1" max="31" name="vencimentoDia" value="${a.vencimentoDia||10}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>

        <button type="submit" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold">Salvar</button>
      </div>
    </form>
  `);
  document.getElementById('formA').addEventListener('submit',e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    data.valor = parseFloat(data.valor)||0;
    data.vencimentoDia = parseInt(data.vencimentoDia)||10;
    const lista = DB.alunos.all();
    if(editId){

    }

    closeModal(); toast('Aluno salvo com sucesso!'); renderAlunos();
  });
}

function switchTab(btn,tabId){
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active');b.classList.add('bg-slate-100','dark:bg-slate-700');});
  btn.classList.add('active'); btn.classList.remove('bg-slate-100','dark:bg-slate-700');
  const modal = document.getElementById('modalBody');
  ['tabInfo','tabNotas','tabFreq','tabTarefas','tabPortfolio','tabPags'].forEach(t=>{
    const el = modal.querySelector('#'+t);
    if(el) el.classList.toggle('hidden', t!==tabId);
  });
}
function delAluno(id){
  if(!confirm('Excluir este aluno?')) return;
  DB.alunos.save(DB.alunos.all().filter(a=>a.id!==id));
  toast('Aluno excluído'); renderAlunos();
}

function drawPortfolio(){
  const q = (document.getElementById('buscaPortfolio')?.value||'').toLowerCase();
  const f = document.getElementById('filtroTipo')?.value||'';
  let lista = DB.portfolios.all().sort((a,b)=>new Date(b.data)-new Date(a.data));
  
  if(q) {
    const alunosMatch = DB.alunos.all().filter(a=>a.nome.toLowerCase().includes(q)).map(a=>a.id);
    lista = lista.filter(p=>alunosMatch.includes(p.alunoId));
  }
  if(f) lista = lista.filter(p=>p.tipo===f);

  const el = document.getElementById('listaPortfolio');
  if(!lista.length){ el.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Nenhum documento encontrado.</div>`; return; }
  
  el.innerHTML = lista.map(p=>{
    const a = DB.alunos.all().find(x=>x.id===p.alunoId);
    const t = a ? DB.turmas.all().find(x=>x.id===a.turmaId) : null;
    const isImg = p.fileType && p.fileType.startsWith('image/');
    const tipoColor = p.tipo==='Prova'?'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300':p.tipo==='Trabalho'?'bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300':'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300';
    
    return `<div class="card-hover bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
      <div class="flex items-start gap-4 mb-4">
        <div class="w-14 h-14 rounded-xl ${isImg?'bg-purple-100 text-purple-600 dark:bg-purple-900/40 dark:text-purple-300':'bg-brand-100 text-brand-600 dark:bg-brand-900/40 dark:text-brand-300'} flex items-center justify-center flex-shrink-0">
          <i data-lucide="${isImg?'image':'file-text'}" class="w-7 h-7"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-lg truncate">${p.fileName}</p>
          <p class="text-sm text-slate-500 truncate">${a?a.nome:'Aluno removido'} • ${t?t.nome:'Sem turma'}</p>
          <div class="flex flex-wrap gap-2 mt-2">
            <span class="badge ${tipoColor}">${p.tipo}</span>
            <span class="badge bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300">${p.disciplina}</span>
          </div>
        </div>
      </div>
      <p class="text-xs text-slate-500 mb-4 line-clamp-2">${p.descricao||'Sem descrição'}</p>
      <div class="flex items-center justify-between pt-3 border-t border-slate-200 dark:border-slate-700">
        <span class="text-xs text-slate-500"><i data-lucide="calendar" class="w-3 h-3 inline"></i> ${fmtDate(p.data)}</span>
        <div class="flex gap-2">
          <button onclick="downloadFile('${p.id}')" class="px-3 py-1.5 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 text-xs font-semibold flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i> Baixar</button>
          <button onclick="delPortfolio('${p.id}')" class="px-3 py-1.5 rounded-lg bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

function uploadPortfolio(alunoIdFixo){
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const turmas = DB.turmas.all();
  
  openModal('Upload de Documento', `
    <form id="formPort" class="space-y-4">
      <div><label class="text-xs font-semibold">Aluno</label>
        <select name="alunoId" required class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
          <option value="">Selecione...</option>
          ${alunos.map(a=>{const t=turmas.find(x=>x.id===a.turmaId);return `<option value="${a.id}" ${a.id===alunoIdFixo?'selected':''}>${a.nome} — ${t?t.nome:''}</option>`;}).join('')}
        </select></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs font-semibold">Disciplina</label>
          <input name="disciplina" required placeholder="Ex: Matemática" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
        <div><label class="text-xs font-semibold">Tipo</label>
          <select name="tipo" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
            <option>Prova</option><option>Trabalho</option><option>Atividade</option><option>Outro</option>
          </select></div>
      </div>
      <div><label class="text-xs font-semibold">Descrição (opcional)</label>
        <textarea name="descricao" rows="2" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"></textarea></div>
      <div><label class="text-xs font-semibold">Data da aplicação</label>
        <input type="date" name="data" value="${new Date().toISOString().split('T')[0]}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
      <div>
        <label class="text-xs font-semibold">Arquivo (PDF ou Imagem - máx 2MB)</label>
        <div class="mt-1 flex items-center gap-2">
          <input type="file" id="fileInput" accept=".pdf,image/*" required class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 dark:file:bg-brand-900/40 dark:file:text-brand-300"/>
        </div>
        <p class="text-xs text-amber-600 mt-1"><i data-lucide="info" class="w-3 h-3 inline"></i> Arquivos grandes podem estourar o limite do navegador. Em produção, usaremos Firebase Storage.</p>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold">Cancelar</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold">Salvar e Upload</button>
      </div>
    </form>
  `);
  
  document.getElementById('formPort').addEventListener('submit',e=>{
    e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    
    if(file.size > 2 * 1024 * 1024) {
      return toast('Arquivo muito grande! Máximo 2MB.','error');
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      data.id = id();
      data.fileName = file.name;
      data.fileType = file.type;
      data.fileData = evt.target.result; // Base64
      data.data = data.data || new Date().toISOString();
      
      const lista = DB.portfolios.all();
      lista.push(data);
      DB.portfolios.save(lista);
      closeModal(); 
      toast('Documento salvo no portfólio!'); 
      
      // Atualiza a tela correta
      if(alunoIdFixo) { verAluno(alunoIdFixo); setTimeout(()=>switchTab(document.querySelector('[onclick*="tabPortfolio"]'),'tabPortfolio'), 100); }
      else { renderPortfolio(); }
    };
    reader.readAsDataURL(file);
  });
}

function downloadFile(pid){
  const p = DB.portfolios.all().find(x=>x.id===pid);
  if(!p) return;
  const link = document.createElement('a');
  link.href = p.fileData;
  link.download = p.fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function delPortfolio(pid){
  if(!confirm('Excluir este documento?')) return;
  DB.portfolios.save(DB.portfolios.all().filter(p=>p.id!==pid));
  toast('Documento excluído'); 
  // Tenta detectar onde estamos
  if(document.getElementById('listaPortfolio')) renderPortfolio();
  else {
    // Estamos no modal do aluno, recarrega a aba
    const modalBody = document.getElementById('modalBody');
    const activeTab = modalBody.querySelector('.tab-btn.active');
    if(activeTab) {
      const alunoId = activeTab.closest('.space-y-4').querySelector('h3')?.textContent; // Hacky, melhor passar o ID
      // Vamos apenas recarregar o modal se soubermos o ID. 
      // Para simplificar, vamos apenas remover o elemento visualmente e avisar
      toast('Documento excluído. Recarregue a aba.');
    }
  }
}

/* ============ NOTAS/DESEMPENHO ============ */
let chartNotas;
function renderNotas(){
  const turmas = DB.turmas.all();
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const notas = DB.notas.all();

  const mediaPorTurma = turmas.map(t=>{
    const alunosTurma = alunos.filter(a=>a.turmaId===t.id);
    const notasTurma = notas.filter(n=>alunosTurma.some(a=>a.id===n.alunoId));
    const media = notasTurma.length ? notasTurma.reduce((s,n)=>s+n.nota,0)/notasTurma.length : 0;
    return {turma:t.nome,media};
  });

  const desempenhoAlunos = alunos.map(a=>{
    const notasA = notas.filter(n=>n.alunoId===a.id);
    const media = notasA.length ? notasA.reduce((s,n)=>s+n.nota,0)/notasA.length : 0;
    return {aluno:a.nome,media,turma:DB.turmas.all().find(t=>t.id===a.turmaId)?.nome||''};
  }).sort((a,b)=>a.media-b.media);
  const baixos = desempenhoAlunos.filter(a=>a.media<6 && a.media>0).slice(0,5);

  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard('Total de Notas', notas.length, 'clipboard-list', 'gradient-brand', 'text-white')}
      ${statCard('Média Geral', (notas.length?(notas.reduce((s,n)=>s+n.nota,0)/notas.length):0).toFixed(1), 'target', 'gradient-mint', 'text-white')}
      ${statCard('Alunos em risco', baixos.length, 'alert-triangle', 'gradient-peach', 'text-white')}
      ${statCard('Aprovados (>6)', desempenhoAlunos.filter(a=>a.media>=6).length, 'check-circle', 'gradient-lav', 'text-white')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">Média por Turma</h3>
        <canvas id="chartNotas" height="110"></canvas>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">⚠️ Alunos em risco</h3>
        <div class="space-y-2">
          ${baixos.map(a=>`<div class="flex items-center justify-between p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
            <div>
              <p class="font-semibold text-sm">${a.aluno}</p>
              <p class="text-xs text-slate-500">${a.turma}</p>
            </div>
            <span class="badge bg-red-200 text-red-900">${a.media.toFixed(1)}</span>
          </div>`).join('') || '<p class="text-sm text-slate-500">Nenhum aluno em risco.</p>'}
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h3 class="font-bold">Lançamento de Notas</h3>
        <button onclick="formNota()" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> Nova nota
        </button>
      </div>
      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="lancarTurma()" class="px-4 py-2 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-semibold text-sm flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Lançar por turma</button>
        <button onclick="lancarMassa()" class="px-4 py-2 rounded-lg bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 font-semibold text-sm flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4"></i> Lançamento em massa</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 dark:bg-slate-700/50 text-left">
            <tr><th class="p-3">Aluno</th><th class="p-3">Disciplina</th><th class="p-3">Tipo</th><th class="p-3">Trim</th><th class="p-3">Nota</th><th class="p-3">Data</th><th></th></tr>
          </thead>
          <tbody>
            ${notas.sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,30).map(n=>{
              const a = alunos.concat(DB.alunos.all()).find(x=>x.id===n.alunoId);
              const cor = n.nota>=6?'text-emerald-600':'text-red-600';
              return `<tr class="border-t border-slate-200 dark:border-slate-700">
                <td class="p-3 font-semibold">${a?a.nome:'—'}</td>
                <td class="p-3">${n.disciplina}</td>
                <td class="p-3"><span class="badge bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300">${n.tipo}</span></td>
                <td class="p-3">${n.trimestre}º</td>
                <td class="p-3 font-bold ${cor}">${n.nota.toFixed(1)}/${n.notaMax}</td>
                <td class="p-3 text-slate-500">${fmtDate(n.data)}</td>
                <td class="p-3 text-right"><button onclick="delNota('${n.id}')" class="text-red-600 hover:underline text-xs">Excluir</button></td>
              </tr>`;
            }).join('') || '<tr><td colspan="7" class="p-6 text-center text-slate-500">Nenhuma nota registrada.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const ctx = document.getElementById('chartNotas').getContext('2d');
  if(chartNotas) chartNotas.destroy();
  chartNotas = new Chart(ctx,{
    type:'bar',
    data:{labels:mediaPorTurma.map(m=>m.turma),datasets:[{label:'Média',data:mediaPorTurma.map(m=>m.media),backgroundColor:'#3f6bff',borderRadius:8}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:10,grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false}}}}
  });
}

function gerarBoletimPDF(alunoId){
  const a = DB.alunos.all().find(x=>x.id===alunoId); if(!a) return;
  const t = DB.turmas.all().find(x=>x.id===a.turmaId);
  const medias = calcularMedias(alunoId);
  const disciplinas = Object.keys(medias);
  const mediaGeral = disciplinas.length ? disciplinas.reduce((s,d)=>s+medias[d].media,0)/disciplinas.length : 0;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18); doc.text('Boletim Escolar',14,20);
  doc.setFontSize(10); doc.text('EduGestão — Reforço Escolar',14,28);
  doc.setDrawColor(63,107,255); doc.setLineWidth(1); doc.line(14,32,196,32);

  doc.setFontSize(11);
  doc.text(`Aluno: ${a.nome}`,14,42);
  doc.text(`Turma: ${t?t.nome:'—'}`,14,50);
  doc.text(`Responsável: ${a.responsavel}`,14,58);
  doc.text(`Média Geral: ${mediaGeral.toFixed(1)}`,140,42);

  const body = disciplinas.map(d=>{
    const m = medias[d];
    return [d, m[1]?m[1].toFixed(1):'—', m[2]?m[2].toFixed(1):'—', m[3]?m[3].toFixed(1):'—', m.media.toFixed(1), m.media>=6?'Aprovado':'Reprovado'];
  });
  doc.autoTable({
    startY:65,
    head:[['Disciplina','1º Trim','2º Trim','3º Trim','Média','Situação']],
    body,
    styles:{fontSize:9},
    headStyles:{fillColor:[63,107,255]}
  });

  doc.save(`boletim-${a.nome.replace(/\s/g,'_')}.pdf`);
  toast('Boletim gerado!');
}

let chartFreq;
function renderFrequencia(){
  const turmas = DB.turmas.all();
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const freqs = DB.frequencias.all();

  const freqPorTurma = turmas.map(t=>{
    const alunosT = alunos.filter(a=>a.turmaId===t.id);
    const freqsT = freqs.filter(f=>alunosT.some(a=>a.id===f.alunoId));
    const presentes = freqsT.filter(f=>f.status==='presente').length;
    const total = freqsT.length;
    const pct = total ? (presentes/total)*100 : 100;
    return {turma:t.nome,percentual:pct};
  });

  const baixaFreq = alunos.map(a=>({aluno:a.nome,percentual:calcularFrequencia(a.id).percentual,turma:DB.turmas.all().find(t=>t.id===a.turmaId)?.nome||''}))
    .filter(a=>a.percentual<75).sort((a,b)=>a.percentual-b.percentual);

  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard('Registros Totais', freqs.length, 'calendar-check', 'gradient-brand', 'text-white')}
      ${statCard('Frequência Média', (alunos.length?alunos.reduce((s,a)=>s+calcularFrequencia(a.id).percentual,0)/alunos.length:0).toFixed(0)+'%', 'target', 'gradient-mint', 'text-white')}
      ${statCard('Baixa Frequência', baixaFreq.length, 'alert-triangle', 'gradient-peach', 'text-white')}
      ${statCard('Adequada (≥75%)', alunos.filter(a=>calcularFrequencia(a.id).percentual>=75).length, 'check-circle', 'gradient-lav', 'text-white')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">Frequência por Turma</h3>
        <canvas id="chartFreq" height="110"></canvas>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">⚠️ Baixa frequência</h3>
        <div class="space-y-2">
          ${baixaFreq.slice(0,5).map(a=>`<div class="flex items-center justify-between p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
            <div>
              <p class="font-semibold text-sm">${a.aluno}</p>
              <p class="text-xs text-slate-500">${a.turma}</p>
            </div>
            <span class="badge bg-red-200 text-red-900">${a.percentual.toFixed(0)}%</span>
          </div>`).join('') || '<p class="text-sm text-slate-500">Todos com frequência adequada.</p>'}
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h3 class="font-bold">Registro de Frequência</h3>
        <button onclick="formFrequencia()" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> Novo registro
        </button>
      </div>
      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="chamadaTurma()" class="px-4 py-2 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-semibold text-sm flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Chamada por turma</button>
        <button onclick="chamadaHoje()" class="px-4 py-2 rounded-lg bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 font-semibold text-sm flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> Chamada de hoje</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 dark:bg-slate-700/50 text-left">
            <tr><th class="p-3">Aluno</th><th class="p-3">Data</th><th class="p-3">Status</th><th></th></tr>
          </thead>
          <tbody>
            ${freqs.sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,30).map(f=>{
              const a = alunos.concat(DB.alunos.all()).find(x=>x.id===f.alunoId);
              return `<tr class="border-t border-slate-200 dark:border-slate-700">
                <td class="p-3 font-semibold">${a?a.nome:'—'}</td>
                <td class="p-3">${fmtDate(f.data)}</td>
                <td class="p-3"><span class="badge status-${f.status}">${f.status.charAt(0).toUpperCase()+f.status.slice(1)}</span></td>
                <td class="p-3 text-right"><button onclick="delFreq('${f.id}')" class="text-red-600 hover:underline text-xs">Excluir</button></td>
              </tr>`;
            }).join('') || '<tr><td colspan="4" class="p-6 text-center text-slate-500">Nenhum registro.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const ctx = document.getElementById('chartFreq').getContext('2d');
  if(chartFreq) chartFreq.destroy();
  chartFreq = new Chart(ctx,{
    type:'bar',
    data:{labels:freqPorTurma.map(f=>f.turma),datasets:[{label:'Frequência %',data:freqPorTurma.map(f=>f.percentual),backgroundColor:'#3f6bff',borderRadius:8}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false}}}}
  });
}

  });

function drawTarefas(){

  else if(f==='concluidas') lista = lista.filter(t=>t.status==='concluida');

  const el = document.getElementById('listaTarefas');

    const turma = DB.turmas.all().find(x=>x.id===t.turmaId);

      </div>

        <p><i data-lucide="calendar" class="w-3.5 h-3.5 inline mr-1 text-slate-400"></i> Prazo: ${fmtDate(t.prazo)}</p>

function concluirTarefa(tid){

/* ============ TURMAS ============ */
function renderTurmas(){
  const turmas = DB.turmas.all();
  const alunos = DB.alunos.all();
  const alunosPorTurma = {};
  alunos.forEach(a=>{ alunosPorTurma[a.turmaId]=(alunosPorTurma[a.turmaId]||0)+1; });
  document.getElementById('content').innerHTML = `
    <div class="flex items-center justify-between mb-5">
      <p class="text-sm text-slate-500">Gerencie turmas e acompanhe a ocupação.</p>
      <button onclick="formTurma()" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Nova turma</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      ${turmas.map(t=>{
        const qtd = alunosPorTurma[t.id]||0;
        const vagas = t.maxAlunos - qtd;
        const pct = Math.round(qtd/t.maxAlunos*100);
        const notas = DB.notas.all().filter(n=>alunos.some(a=>a.turmaId===t.id && a.id===n.alunoId));
        const media = notas.length ? notas.reduce((s,n)=>s+n.nota,0)/notas.length : 0;
        return `<div class="card-hover bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h3 class="font-bold text-lg">${t.nome}</h3>
              <p class="text-sm text-slate-500"><i data-lucide="user" class="w-3.5 h-3.5 inline"></i> ${t.professor}</p>
              <p class="text-sm text-slate-500"><i data-lucide="clock" class="w-3.5 h-3.5 inline"></i> ${t.horario}</p>
            </div>
            <button onclick="formTurma('${t.id}')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
          </div>
          <div class="space-y-2">
            <div class="flex justify-between text-sm"><span>Alunos</span><b>${qtd}/${t.maxAlunos}</b></div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2"><div class="h-2 rounded-full gradient-brand" style="width:${pct}%"></div></div>
            <div class="flex justify-between text-xs text-slate-500"><span>Ocupação ${pct}%</span><span class="font-semibold ${vagas>0?'text-emerald-600':'text-red-600'}">${vagas>0?vagas+' vagas':'Lotada'}</span></div>
            <div class="pt-2 border-t border-slate-200 dark:border-slate-700 flex justify-between text-xs">
              <span class="text-slate-500">Média da turma</span>
              <span class="font-bold ${media>=6?'text-emerald-600':'text-red-600'}">${media?media.toFixed(1):'—'}</span>
            </div>
          </div>
        </div>`;
      }).join('') || '<p class="text-slate-500">Nenhuma turma cadastrada.</p>'}
    </div>
  `;
}

function enviarComunicado(){
  const ids = Array.from(document.querySelectorAll('.dest:checked')).map(c=>c.value);
  const msg = document.getElementById('msgCom').value.trim();
  if(!ids.length) return toast('Selecione ao menos um destinatário','error');
  if(!msg) return toast('Digite a mensagem','error');
  const alunos = DB.alunos.all();
  const destinatarios = ids.map(i=>alunos.find(a=>a.id===i)).filter(Boolean);
  destinatarios.forEach(a=>{
    const url = `https://wa.me/${a.telefone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
    window.open(url,'_blank');
  });
  const hist = DB.comunicados.all();
  hist.push({id:id(),data:new Date().toISOString(),mensagem:msg,destinatarios:ids});
  DB.comunicados.save(hist);
  toast(`${destinatarios.length} mensagem(ns) disparada(s)!`);

}

function receitaMes(pags,d){ return pags.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).reduce((s,p)=>s+p.valor,0); }
function receitaAno(pags,d){ return pags.filter(p=>new Date(p.data).getFullYear()===d.getFullYear()).reduce((s,p)=>s+p.valor,0); }
let chartFin;
function drawFinChart(mode){
  const pags = DB.pagamentos.all();
  const hoje = new Date();
  const labels=[], data=[];
  if(mode==='semanal'){
    for(let i=6;i>=0;i--){
      const d = new Date(hoje); d.setDate(hoje.getDate()-i);
      labels.push(d.toLocaleDateString('pt-BR',{weekday:'short'}));
      data.push(pags.filter(p=>new Date(p.data).toDateString()===d.toDateString()).reduce((s,p)=>s+p.valor,0));
    }
  } else if(mode==='mensal'){
    for(let i=29;i>=0;i--){
      const d = new Date(hoje); d.setDate(hoje.getDate()-i);
      labels.push(d.getDate());
      data.push(pags.filter(p=>new Date(p.data).toDateString()===d.toDateString()).reduce((s,p)=>s+p.valor,0));
    }
  } else {
    for(let i=11;i>=0;i--){
      const d = new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));
      data.push(pags.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).reduce((s,p)=>s+p.valor,0));
    }
  }
  const ctx = document.getElementById('chartFin').getContext('2d');
  if(chartFin) chartFin.destroy();
  chartFin = new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Receita',data,borderColor:'#3f6bff',backgroundColor:'rgba(63,107,255,.15)',fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}

function relAlunos(fmt){

  });

function relFin(fmt){
  const rows = DB.pagamentos.all().map(p=>{
    const a = DB.alunos.all().find(x=>x.id===p.alunoId);
    return [a?a.nome:'—',fmtDateTime(p.data),p.metodo,fmtBRL(p.valor),p.referente||''];
  });
  exportar(fmt,'Pagamentos',['Aluno','Data','Método','Valor','Referente'],rows);
}
function relTurmas(fmt){
  const alunos = DB.alunos.all();
  const porTurma = {};
  alunos.forEach(a=>porTurma[a.turmaId]=(porTurma[a.turmaId]||0)+1);
  const rows = DB.turmas.all().map(t=>{
    const qtd = porTurma[t.id]||0;
    return [t.nome,t.professor,t.horario,qtd,t.maxAlunos,t.maxAlunos-qtd,Math.round(qtd/t.maxAlunos*100)+'%'];
  });
  exportar(fmt,'Turmas',['Turma','Professor','Horário','Alunos','Máx','Vagas','Ocupação'],rows);
}
function relInad(fmt){
  const hoje = new Date();
  const pags = DB.pagamentos.all();
  const rows = DB.alunos.all().filter(a=>{
    if(a.status!=='ativo') return false;
    const v = new Date(hoje.getFullYear(),hoje.getMonth(),a.vencimentoDia||10);
    return v<hoje && !pags.some(p=>p.alunoId===a.id && new Date(p.data).getMonth()===hoje.getMonth());
  }).map(a=>[a.nome,a.responsavel,a.telefone,fmtBRL(a.valor),'Dia '+a.vencimentoDia]);
  exportar(fmt,'Inadimplentes',['Aluno','Responsável','Telefone','Valor','Vencimento'],rows);

function relDesemp(fmt){
  const rows = DB.alunos.all().filter(a=>a.status==='ativo').map(a=>{
    const medias = calcularMedias(a.id);
    const discs = Object.keys(medias);
    const mediaGeral = discs.length ? discs.reduce((s,d)=>s+medias[d].media,0)/discs.length : 0;
    return [a.nome, discs.join(', '), mediaGeral.toFixed(1), mediaGeral>=6?'Aprovado':'Reprovado'];
  });
  exportar(fmt,'Desempenho',['Aluno','Disciplinas','Média Geral','Situação'],rows);
}
function relBoletim(fmt){
  const rows = [];
  DB.alunos.all().filter(a=>a.status==='ativo').forEach(a=>{
    const medias = calcularMedias(a.id);
    Object.keys(medias).forEach(d=>{
      const m = medias[d];
      rows.push([a.nome,d,m[1]?m[1].toFixed(1):'—',m[2]?m[2].toFixed(1):'—',m[3]?m[3].toFixed(1):'—',m.media.toFixed(1)]);

function relPortfolio(fmt){

function exportar(fmt,nome,heads,rows){
  if(fmt==='xlsx'){
    const ws = XLSX.utils.aoa_to_sheet([heads,...rows]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,nome);
    XLSX.writeFile(wb,`${nome}.xlsx`);
  } else {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Relatório — '+nome,14,18);
    doc.autoTable({head:[heads],body:rows,startY:25,styles:{fontSize:9}});
    doc.save(`${nome}.pdf`);
  }
  toast('Relatório gerado!');
}

/* ============ INIT ============ */
go('dashboard');
lucide.createIcons();
</script>
</body>
