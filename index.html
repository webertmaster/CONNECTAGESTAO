<script>
/* ============ HELPERS (Etapa 1) ============ */
/* Proteção de texto: neutraliza < > & " ' antes de colocar no HTML */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Datas no horário local (Brasil), nunca em UTC */
function pad(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hojeISO(){ return toISODate(new Date()); }
function parseDate(d){
  if(!d) return null;
  if(d instanceof Date) return d;
  if(typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const [y,m,dd] = d.split('-').map(Number);
    return new Date(y,m-1,dd);
  }
  return new Date(d);
}
function inicioHoje(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function isVencida(prazo){ const p=parseDate(prazo); return !!p && p < inicioHoje(); }
function fmtCurta(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }

/* Vencimentos: considera virada de mês, mês curto e pagamento já feito */
function dataVenc(ano,mes,dia){
  const ult = new Date(ano,mes+1,0).getDate();
  return new Date(ano,mes,Math.min(dia||10,ult));
}
function diasAte(d){ return Math.round((d-inicioHoje())/86400000); }
function pagoNoMes(alunoId,ano,mes,pags){
  return (pags||DB.pagamentos.all()).some(p=>{
    const x = new Date(p.data);
    return p.alunoId===alunoId && x.getMonth()===mes && x.getFullYear()===ano;
  });
}
/* ===== Mensalidades (Etapa 2) ===== */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function compOf(d){ const x = parseDate(d) || new Date(); return x.getFullYear()+'-'+pad(x.getMonth()+1); }
function compAtual(){ return compOf(new Date()); }
function addMes(comp,n){ const [y,m] = comp.split('-').map(Number); return compOf(new Date(y,m-1+n,1)); }
function compLabel(comp){ const [y,m] = comp.split('-').map(Number); return MESES[m-1]+' de '+y; }
function compCurta(comp){ const [y,m] = comp.split('-').map(Number); return MESES[m-1].slice(0,3)+'/'+y; }
function compMes(comp){ return MESES[Number(comp.split('-')[1])-1].toLowerCase(); }
function vencDaComp(comp,dia){ const [y,m] = comp.split('-').map(Number); return dataVenc(y,m-1,dia); }
function dataParaISO(str){
  if(!str || str===hojeISO()) return new Date().toISOString();
  const d = parseDate(str); d.setHours(12,0,0,0); return d.toISOString();
}

/* Situação de uma mensalidade: pago | aberto | atrasado */
function stMens(m){
  if(m.pagoEm) return {tipo:'pago', dias:0, texto:'Pago em '+fmtCurta(parseDate(m.pagoEm))};
  const dias = diasAte(parseDate(m.vencimento));
  if(dias<0) return {tipo:'atrasado', dias:-dias, texto:'Atrasado '+(-dias)+(dias===-1?' dia':' dias')};
  if(dias===0) return {tipo:'aberto', dias:0, texto:'Vence hoje'};
  return {tipo:'aberto', dias, texto:'Vence em '+dias+(dias===1?' dia':' dias')};
}

function criarMensalidade(a,comp){
  return {
    id:id(), alunoId:a.id, competencia:comp, valor:+a.valor||0,
    vencimento:toISODate(vencDaComp(comp,a.vencimentoDia)),
    pagoEm:null, valorPago:null, metodo:null, pagamentoId:null, obs:'', ultimoContato:null,
    criadaEm:new Date().toISOString()
  };
}

/* Gera a mensalidade do mês para cada aluno ativo que ainda não tem. Retorna quantas criou. */
function gerarMensalidades(comp,forcar){
  comp = comp || compAtual();
  const lista = DB.mensalidades.all();
  let novos = 0;
  DB.alunos.all().filter(a=>a.status==='ativo').forEach(a=>{
    if(lista.some(m=>m.alunoId===a.id && m.competencia===comp)) return;
    const c = parseDate(a.dataCadastro);
    if(c){
      if(comp < compOf(c)) return; // não cobra mês anterior ao cadastro
      if(!forcar){
        const cd = new Date(c.getFullYear(),c.getMonth(),c.getDate());
        if(cd > vencDaComp(comp,a.vencimentoDia)) return; // entrou depois do vencimento deste mês
      }
    }
    lista.push(criarMensalidade(a,comp));
    novos++;
  });
  if(novos) DB.mensalidades.save(lista);
  return novos;
}

/* Liga os pagamentos antigos ao mês da data em que foram feitos (roda uma vez) */
function migrarPagamentos(){
  if(localStorage.getItem('edu_mig_mens')) return;
  const pags = DB.pagamentos.all();
  const lista = DB.mensalidades.all();
  const alunos = DB.alunos.all();
  pags.forEach(p=>{
    if(p.mensalidadeId) return;
    const a = alunos.find(x=>x.id===p.alunoId);
    if(!a) return;
    const comp = compOf(p.data);
    if(lista.some(x=>x.alunoId===a.id && x.competencia===comp)) return;
    const m = criarMensalidade(a,comp);
    m.pagoEm = toISODate(new Date(p.data));
    m.valorPago = +p.valor||0;
    m.metodo = p.metodo;
    m.pagamentoId = p.id;
    lista.push(m);
    p.mensalidadeId = m.id;
    p.competencia = comp;
    p.referente = 'Mensalidade de '+compLabel(comp);
  });
  DB.mensalidades.save(lista);
  DB.pagamentos.save(pags);
  localStorage.setItem('edu_mig_mens','1');
}

/* Registra o pagamento de uma mensalidade (cria o pagamento e marca como paga) */
function pagarMensalidade(mid,{valor,metodo,data,obs}){
  const ms = DB.mensalidades.all();
  const m = ms.find(x=>x.id===mid);
  if(!m) return null;
  const pg = {
    id:id(), alunoId:m.alunoId, valor, metodo, data:dataParaISO(data),
    referente:'Mensalidade de '+compLabel(m.competencia),
    mensalidadeId:m.id, competencia:m.competencia, obs:obs||''
  };
  const pl = DB.pagamentos.all();
  pl.push(pg);
  if(!DB.pagamentos.save(pl)) return null;
  m.pagoEm = data || hojeISO();
  m.valorPago = valor;
  m.metodo = metodo;
  m.pagamentoId = pg.id;
  m.obs = obs||'';
  DB.mensalidades.save(ms);
  return {m,pg};
}

function desfazerPagamento(mid){
  if(!confirm('Desfazer este pagamento? A mensalidade volta a ficar em aberto.')) return;
  const ms = DB.mensalidades.all();
  const m = ms.find(x=>x.id===mid);
  if(!m) return;
  DB.pagamentos.save(DB.pagamentos.all().filter(p=>p.id!==m.pagamentoId));
  m.pagoEm = null; m.valorPago = null; m.metodo = null; m.pagamentoId = null;
  DB.mensalidades.save(ms);
  toast('Pagamento desfeito');
  refreshPagina();
}

function delMens(mid){
  if(!confirm('Excluir esta cobrança?')) return;
  DB.mensalidades.save(DB.mensalidades.all().filter(m=>m.id!==mid));
  toast('Cobrança excluída');
  refreshPagina();
}

/* Quando o aluno é editado, atualiza valor/vencimento das cobranças em aberto do mês atual em diante */
function sincronizarMensalidadesAluno(a){
  const ms = DB.mensalidades.all();
  const atual = compAtual();
  let mudou = false;
  ms.forEach(m=>{
    if(m.alunoId!==a.id || m.pagoEm || m.competencia<atual) return;
    if(a.status!=='ativo'){ m._del = true; mudou = true; return; }
    const nv = toISODate(vencDaComp(m.competencia,a.vencimentoDia));
    if(m.valor!==a.valor || m.vencimento!==nv){ m.valor = a.valor; m.vencimento = nv; mudou = true; }
  });
  if(mudou) DB.mensalidades.save(ms.filter(m=>!m._del));
}

/* Próximo vencimento do aluno (usado no Dashboard, Automação e relatórios) */
function statusVencimento(a){
  const ms = DB.mensalidades.all().filter(m=>m.alunoId===a.id);
  const abertas = ms.filter(m=>!m.pagoEm).sort((x,y)=>x.vencimento.localeCompare(y.vencimento));
  if(abertas.length){
    const m = abertas[0];
    const v = parseDate(m.vencimento);
    const d = diasAte(v);
    return {venc:v, dias:d, atrasado:d<0, mensalidade:m};
  }
  const ult = ms.map(m=>m.competencia).sort().pop();
  let comp = ult ? addMes(ult,1) : compAtual();
  let v = vencDaComp(comp,a.vencimentoDia);
  if(!ult && v < inicioHoje()) v = vencDaComp(addMes(comp,1),a.vencimentoDia);
  return {venc:v, dias:diasAte(v), atrasado:false};
}

/* WhatsApp: adiciona 55 se o número vier sem código do país */
function foneWA(t){
  let d = String(t||'').replace(/\D/g,'');
  if(d.length<=11) d = '55'+d;
  return d;
}

/* Armazenamento do navegador */
const LIMITE_STORAGE = 5*1024*1024;
function usoStorage(){
  let total = 0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('edu_')) total += k.length + (localStorage.getItem(k)||'').length;
  }
  return total;
}

function calcularMedias(alunoId){
  const notas = DB.notas.all().filter(n=>n.alunoId===alunoId);
  const porDisc = {};
  notas.forEach(n=>{
    if(!porDisc[n.disciplina]) porDisc[n.disciplina] = {1:[],2:[],3:[]};
    if(porDisc[n.disciplina][n.trimestre]) porDisc[n.disciplina][n.trimestre].push(n.nota);
  });
  const res = {};
  Object.keys(porDisc).forEach(d=>{
    res[d] = {};
    [1,2,3].forEach(tri=>{
      const arr = porDisc[d][tri]||[];
      res[d][tri] = arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
    });
    const todas = Object.values(res[d]);
    res[d].media = todas.reduce((a,b)=>a+b,0)/todas.length;
  });
  return res;
}

function calcularFrequencia(alunoId){
  const freqs = DB.frequencias.all().filter(f=>f.alunoId===alunoId);
  const total = freqs.length;
  const presentes = freqs.filter(f=>f.status==='presente').length;
  const faltas = freqs.filter(f=>f.status==='falta').length;
  const justificadas = freqs.filter(f=>f.status==='justificada').length;
  const percentual = total ? (presentes/total)*100 : 100;
  return {total,presentes,faltas,justificadas,percentual};
}

let chart1;
const DIAS_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

/* Lê os dias da semana de um texto como "Seg/Qua 14h" */
function parseDiasHorario(txt){
  const n = String(txt||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const mapa = {dom:0,seg:1,ter:2,qua:3,qui:4,sex:5,sab:6};
  const out = new Set();
  const re = /\b(dom|seg|ter|qua|qui|sex|sab)/g;
  let m;
  while((m = re.exec(n))) out.add(mapa[m[1]]);
  return Array.from(out).sort((a,b)=>a-b);
}
/* Se a turma tem dias definidos (editados), usa eles; senão lê do horário */
function diasDaTurma(t){ return (t.dias && t.dias.length) ? t.dias : parseDiasHorario(t.horario); }
/* true = tem aula hoje, false = não tem, null = sem dia definido */
function turmaTemAulaHoje(t){
  const d = diasDaTurma(t);
  if(!d.length) return null;
  return d.includes(new Date().getDay());
}

    : tars.length ? badge(tars.length+' vence'+(tars.length===1?'':'m')+' em breve','am') : badge('Em dia','ok');
  const corpoT = (linhasT || vazio('Nenhuma tarefa vencendo nos próximos 7 dias.'))
    + (tars.length>4 ? `<div class="pt-2.5 border-t border-slate-200 dark:border-slate-700">${btn(cBrand,"go('tarefas')",'list-checks',`Ver todas (${tars.length})`)}</div>` : '');

  /* 4. Atenção */
  const itens = [];
  ativos.forEach(a=>{
    const b = parseDate(a.nascimento);
    if(b){
      let prox = new Date(hoje.getFullYear(),b.getMonth(),b.getDate());
      if(prox < inicioHoje()) prox = new Date(hoje.getFullYear()+1,b.getMonth(),b.getDate());
      const d = diasAte(prox);
      if(d<=7){
        const idade = prox.getFullYear()-b.getFullYear();
        if(d===0) itens.push({ord:0, html:linha(`${esc(a.nome)} faz aniversário hoje`, `${idade} anos`, btn(cBrand,`parabenizar('${a.id}')`,'gift','Parabenizar'))});
        else itens.push({ord:3, html:linha(`${esc(a.nome)} faz aniversário ${d===1?'amanhã':'em '+fmtCurta(prox)}`, `${idade} anos`, '')});
      }
    }
    const fr = calcularFrequencia(a.id);
    if(fr.total>=3 && fr.percentual<75)
      itens.push({ord:1, html:linha(`${esc(a.nome)} está com frequência de ${Math.round(fr.percentual)}%`, pl(fr.faltas,'falta','faltas'), btn(cBrand,`verAluno('${a.id}')`,'user','Ver aluno'))});
    const ns = DB.notas.all().filter(n=>n.alunoId===a.id);
    if(ns.length>=2){
      const med = ns.reduce((s,n)=>s+(+n.nota||0)/(+n.notaMax||10)*10,0)/ns.length;
      if(med<6) itens.push({ord:2, html:linha(`${esc(a.nome)} está com média ${med.toFixed(1).replace('.',',')}`, 'Abaixo de 6', btn(cBrand,`verAluno('${a.id}')`,'user','Ver aluno'))});
    }
  });
  itens.sort((x,y)=>x.ord-y.ord);
  const corpoA = (itens.slice(0,6).map(x=>x.html).join('') || vazio('Nenhum aviso hoje.'))
    + (itens.length>6 ? vazio(`e mais ${itens.length-6} aviso(s).`) : '');
  const bdgA = itens.length ? badge(pl(itens.length,'aviso','avisos'),'am') : badge('Tudo certo','ok');

  const total = chamadaPend + listaC.length + tars.length + itens.filter(x=>x.ord<3).length;

  /* Resumo */
  const notas = DB.notas.all();
  const mediaGeral = notas.length ? notas.reduce((s,n)=>s+n.nota,0)/notas.length : 0;
  const freqMedia = ativos.length ? ativos.reduce((s,a)=>s+calcularFrequencia(a.id).percentual,0)/ativos.length : 0;
  const pag = DB.pagamentos.all();
  const mini = (rot,val)=>`<div class="bg-white dark:bg-slate-800 rounded-xl p-3 border border-slate-200 dark:border-slate-700"><p class="text-xs text-slate-500">${rot}</p><p class="text-lg font-bold">${val}</p></div>`;

  document.getElementById('content').innerHTML = `
    <div class="mb-5">
      <h3 class="text-2xl font-bold">${saud}!</h3>
      <p class="text-sm text-slate-500">${dataTxt} • ${total ? `<b>${pl(total,'coisa','coisas')} para ver hoje</b>` : '<b class="text-emerald-600">Tudo em dia por hoje.</b>'}</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
      ${secao(1,'Chamada de hoje',bdgCh,corpoCh)}
      ${secao(2,'Cobranças',bdgCob,corpoCob)}
      ${secao(3,'Tarefas',bdgT,corpoT)}
      ${secao(4,'Atenção',bdgA,corpoA)}
    </div>
    <p class="text-sm font-semibold text-slate-500 mb-2">Resumo</p>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      ${mini('Alunos ativos',ativos.length)}
      ${mini('Média geral',mediaGeral?mediaGeral.toFixed(1).replace('.',','):'—')}
      ${mini('Frequência média',freqMedia.toFixed(0)+'%')}
      ${mini('Recebido no mês',fmtBRL(receitaMes(pag,hoje)))}
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
      <h3 class="font-bold mb-4">Pagamentos dos últimos 6 meses</h3>
      <canvas id="chart1" height="90"></canvas>
    </div>
  `;

  const ctx = document.getElementById('chart1').getContext('2d');
  if(chart1) chart1.destroy();
  const labels = [], data = [];
  for(let i=5;i>=0;i--){
    const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
    labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));
    data.push(pag.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()}).reduce((s,p)=>s+p.valor,0));
  }
  chart1 = new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{label:'Receita',data,backgroundColor:'#3f6bff',borderRadius:8}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false}}}}
  });
}

            <div><p class="font-semibold text-sm">${fmtDateTime(p.data)}</p><p class="text-xs text-slate-500">${esc(p.metodo)} • ${esc(p.referente||'')}</p></div>

  if(abaInicial){
    const btn = document.querySelector(`#modalBody .tab-btn[data-tab="${abaInicial}"]`);
    if(btn) switchTab(btn,abaInicial);
  }
}
function switchTab(btn,tabId){
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active');b.classList.add('bg-slate-100','dark:bg-slate-700');});
  btn.classList.add('active'); btn.classList.remove('bg-slate-100','dark:bg-slate-700');
  const modal = document.getElementById('modalBody');
  ['tabInfo','tabNotas','tabFreq','tabTarefas','tabPortfolio','tabPags'].forEach(t=>{
    const el = modal.querySelector('#'+t);
    if(el) el.classList.toggle('hidden', t!==tabId);
  });
}
function delAluno(alunoId){
  if(!confirm('Excluir este aluno?')) return;
  DB.alunos.save(DB.alunos.all().filter(a=>a.id!==alunoId));
  DB.mensalidades.save(DB.mensalidades.all().filter(m=>m.alunoId!==alunoId || m.pagoEm));
  toast('Aluno excluído'); renderAlunos();
}

function drawPortfolio(){
  const q = (document.getElementById('buscaPortfolio')?.value||'').toLowerCase();
  const f = document.getElementById('filtroTipo')?.value||'';
  let lista = DB.portfolios.all().sort((a,b)=>parseDate(b.data)-parseDate(a.data));

  if(q) {
    const alunosMatch = DB.alunos.all().filter(a=>a.nome.toLowerCase().includes(q)).map(a=>a.id);
    lista = lista.filter(p=>alunosMatch.includes(p.alunoId));
  }
  if(f) lista = lista.filter(p=>p.tipo===f);

  const el = document.getElementById('listaPortfolio');
  if(!lista.length){ el.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Nenhum documento encontrado.</div>`; return; }

  el.innerHTML = lista.map(p=>{
    const a = DB.alunos.all().find(x=>x.id===p.alunoId);
    const t = a ? DB.turmas.all().find(x=>x.id===a.turmaId) : null;
    const isImg = p.fileType && p.fileType.startsWith('image/');
    const tipoColor = p.tipo==='Prova'?'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300':p.tipo==='Trabalho'?'bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300':'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300';

    return `<div class="card-hover bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
      <div class="flex items-start gap-4 mb-4">
        <div class="w-14 h-14 rounded-xl ${isImg?'bg-purple-100 text-purple-600 dark:bg-purple-900/40 dark:text-purple-300':'bg-brand-100 text-brand-600 dark:bg-brand-900/40 dark:text-brand-300'} flex items-center justify-center flex-shrink-0">
          <i data-lucide="${isImg?'image':'file-text'}" class="w-7 h-7"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-lg truncate">${esc(p.fileName)}</p>
          <p class="text-sm text-slate-500 truncate">${a?esc(a.nome):'Aluno removido'} • ${t?esc(t.nome):'Sem turma'}</p>
          <div class="flex flex-wrap gap-2 mt-2">
            <span class="badge ${tipoColor}">${esc(p.tipo)}</span>
            <span class="badge bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300">${esc(p.disciplina)}</span>
          </div>
        </div>
      </div>
      <p class="text-xs text-slate-500 mb-4 line-clamp-2">${esc(p.descricao||'Sem descrição')}</p>
      <div class="flex items-center justify-between pt-3 border-t border-slate-200 dark:border-slate-700">
        <span class="text-xs text-slate-500"><i data-lucide="calendar" class="w-3 h-3 inline"></i> ${fmtDate(p.data)}</span>
        <div class="flex gap-2">
          <button onclick="downloadFile('${p.id}')" class="px-3 py-1.5 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 text-xs font-semibold flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i> Baixar</button>
          <button onclick="delPortfolio('${p.id}')" class="px-3 py-1.5 rounded-lg bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300"><i data-lucide="trash-2" class="w-3 h-3"></i></button>

}

function uploadPortfolio(alunoIdFixo){
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const turmas = DB.turmas.all();

  openModal('Upload de Documento', `
    <form id="formPort" class="space-y-4">
      <div><label class="text-xs font-semibold">Aluno</label>
        <select name="alunoId" required class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
          <option value="">Selecione...</option>
          ${alunos.map(a=>{const t=turmas.find(x=>x.id===a.turmaId);return `<option value="${a.id}" ${a.id===alunoIdFixo?'selected':''}>${esc(a.nome)} — ${t?esc(t.nome):''}</option>`;}).join('')}
        </select></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs font-semibold">Disciplina</label>
          <input name="disciplina" required placeholder="Ex: Matemática" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
        <div><label class="text-xs font-semibold">Tipo</label>
          <select name="tipo" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
            <option>Prova</option><option>Trabalho</option><option>Atividade</option><option>Outro</option>
          </select></div>
      </div>
      <div><label class="text-xs font-semibold">Descrição (opcional)</label>
        <textarea name="descricao" rows="2" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"></textarea></div>
      <div><label class="text-xs font-semibold">Data da aplicação</label>
        <input type="date" name="data" value="${hojeISO()}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
      <div>
        <label class="text-xs font-semibold">Arquivo (PDF ou Imagem - máx 2MB)</label>
        <div class="mt-1 flex items-center gap-2">
          <input type="file" id="fileInput" accept=".pdf,image/*" required class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 dark:file:bg-brand-900/40 dark:file:text-brand-300"/>
        </div>
        <p class="text-xs text-amber-600 mt-1"><i data-lucide="info" class="w-3 h-3 inline"></i> Arquivos grandes podem estourar o limite do navegador. Em produção, usaremos Firebase Storage.</p>
      </div>
      ${medidorStorage()}
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold">Cancelar</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold">Salvar e Upload</button>
      </div>
    </form>
  `);

  document.getElementById('formPort').addEventListener('submit',e=>{
    e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if(!file) return toast('Selecione um arquivo.','error');

    if(file.size > 2 * 1024 * 1024) {
      return toast('Arquivo muito grande! Máximo 2MB.','error');
    }
    // base64 ocupa ~4/3 do tamanho original
    const estimado = Math.ceil(file.size*4/3) + 500;
    if(estimado > LIMITE_STORAGE - usoStorage()){
      return toast('Sem espaço no navegador para este arquivo. Exclua documentos antigos.','error');
    }

    const form = e.target;
    const reader = new FileReader();
    reader.onerror = ()=>toast('Não foi possível ler o arquivo.','error');
    reader.onload = function(evt) {
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      data.id = id();
      data.fileName = file.name;
      data.fileType = file.type;
      data.fileData = evt.target.result; // Base64
      data.data = data.data || hojeISO();

      const lista = DB.portfolios.all();
      lista.push(data);
      if(!DB.portfolios.save(lista)) return; // DB já mostrou o erro

      closeModal();
      toast('Documento salvo no portfólio!');

      if(alunoIdFixo) { verAluno(alunoIdFixo,'tabPortfolio'); }
      else { renderPortfolio(); }
      if(document.getElementById('listaAlunos')) drawAlunos();
    };
    reader.readAsDataURL(file);
  });
}

function downloadFile(pid){
  const p = DB.portfolios.all().find(x=>x.id===pid);
  if(!p) return;
  const link = document.createElement('a');
  link.href = p.fileData;
  link.download = p.fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function delPortfolio(pid, alunoId){
  if(!confirm('Excluir este documento?')) return;
  DB.portfolios.save(DB.portfolios.all().filter(p=>p.id!==pid));
  toast('Documento excluído');
  if(alunoId){
    // veio de dentro do modal do aluno: reabre direto na aba do portfólio
    verAluno(alunoId,'tabPortfolio');
    if(document.getElementById('listaAlunos')) drawAlunos();
  } else if(document.getElementById('listaPortfolio')){
    renderPortfolio();
  }
}

/* ============ NOTAS/DESEMPENHO ============ */
let chartNotas;
function renderNotas(){
  const turmas = DB.turmas.all();
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const notas = DB.notas.all();

  const mediaPorTurma = turmas.map(t=>{
    const alunosTurma = alunos.filter(a=>a.turmaId===t.id);
    const notasTurma = notas.filter(n=>alunosTurma.some(a=>a.id===n.alunoId));
    const media = notasTurma.length ? notasTurma.reduce((s,n)=>s+n.nota,0)/notasTurma.length : 0;
    return {turma:t.nome,media};
  });

  const desempenhoAlunos = alunos.map(a=>{
    const notasA = notas.filter(n=>n.alunoId===a.id);
    const media = notasA.length ? notasA.reduce((s,n)=>s+n.nota,0)/notasA.length : 0;
    return {aluno:a.nome,media,turma:DB.turmas.all().find(t=>t.id===a.turmaId)?.nome||''};
  }).sort((a,b)=>a.media-b.media);
  const baixos = desempenhoAlunos.filter(a=>a.media<6 && a.media>0).slice(0,5);

  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard('Total de Notas', notas.length, 'clipboard-list', 'gradient-brand', 'text-white')}
      ${statCard('Média Geral', (notas.length?(notas.reduce((s,n)=>s+n.nota,0)/notas.length):0).toFixed(1), 'target', 'gradient-mint', 'text-white')}
      ${statCard('Alunos em risco', baixos.length, 'alert-triangle', 'gradient-peach', 'text-white')}
      ${statCard('Aprovados (>6)', desempenhoAlunos.filter(a=>a.media>=6).length, 'check-circle', 'gradient-lav', 'text-white')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">Média por Turma</h3>
        <canvas id="chartNotas" height="110"></canvas>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">⚠️ Alunos em risco</h3>
        <div class="space-y-2">
          ${baixos.map(a=>`<div class="flex items-center justify-between p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">

function gerarBoletimPDF(alunoId){
  const a = DB.alunos.all().find(x=>x.id===alunoId); if(!a) return;
  const t = DB.turmas.all().find(x=>x.id===a.turmaId);
  const medias = calcularMedias(alunoId);
  const disciplinas = Object.keys(medias);
  const mediaGeral = disciplinas.length ? disciplinas.reduce((s,d)=>s+medias[d].media,0)/disciplinas.length : 0;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18); doc.text('Boletim Escolar',14,20);
  doc.setFontSize(10); doc.text('EduGestão — Reforço Escolar',14,28);
  doc.setDrawColor(63,107,255); doc.setLineWidth(1); doc.line(14,32,196,32);

  doc.setFontSize(11);
  doc.text(`Aluno: ${a.nome}`,14,42);
  doc.text(`Turma: ${t?t.nome:'—'}`,14,50);
  doc.text(`Responsável: ${a.responsavel}`,14,58);
  doc.text(`Média Geral: ${mediaGeral.toFixed(1)}`,140,42);

  const body = disciplinas.map(d=>{
    const m = medias[d];
    return [d, m[1]?m[1].toFixed(1):'—', m[2]?m[2].toFixed(1):'—', m[3]?m[3].toFixed(1):'—', m.media.toFixed(1), m.media>=6?'Aprovado':'Reprovado'];
  });
  doc.autoTable({
    startY:65,
    head:[['Disciplina','1º Trim','2º Trim','3º Trim','Média','Situação']],
    body,
    styles:{fontSize:9},
    headStyles:{fillColor:[63,107,255]}
  });

  doc.save(`boletim-${a.nome.replace(/\s/g,'_')}.pdf`);
  toast('Boletim gerado!');
}

let chartFreq;
function renderFrequencia(){
  const turmas = DB.turmas.all();
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const freqs = DB.frequencias.all();

  const freqPorTurma = turmas.map(t=>{
    const alunosT = alunos.filter(a=>a.turmaId===t.id);
    const freqsT = freqs.filter(f=>alunosT.some(a=>a.id===f.alunoId));
    const presentes = freqsT.filter(f=>f.status==='presente').length;
    const total = freqsT.length;
    const pct = total ? (presentes/total)*100 : 100;
    return {turma:t.nome,percentual:pct};
  });

  const baixaFreq = alunos.map(a=>({aluno:a.nome,percentual:calcularFrequencia(a.id).percentual,turma:DB.turmas.all().find(t=>t.id===a.turmaId)?.nome||''}))
    .filter(a=>a.percentual<75).sort((a,b)=>a.percentual-b.percentual);

  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard('Registros Totais', freqs.length, 'calendar-check', 'gradient-brand', 'text-white')}
      ${statCard('Frequência Média', (alunos.length?alunos.reduce((s,a)=>s+calcularFrequencia(a.id).percentual,0)/alunos.length:0).toFixed(0)+'%', 'target', 'gradient-mint', 'text-white')}
      ${statCard('Baixa Frequência', baixaFreq.length, 'alert-triangle', 'gradient-peach', 'text-white')}
      ${statCard('Adequada (≥75%)', alunos.filter(a=>calcularFrequencia(a.id).percentual>=75).length, 'check-circle', 'gradient-lav', 'text-white')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">Frequência por Turma</h3>
        <canvas id="chartFreq" height="110"></canvas>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">⚠️ Baixa frequência</h3>
        <div class="space-y-2">
          ${baixaFreq.slice(0,5).map(a=>`<div class="flex items-center justify-between p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
            <div>
              <p class="font-semibold text-sm">${esc(a.aluno)}</p>
              <p class="text-xs text-slate-500">${esc(a.turma)}</p>
            </div>
            <span class="badge bg-red-200 text-red-900">${a.percentual.toFixed(0)}%</span>
          </div>`).join('') || '<p class="text-sm text-slate-500">Todos com frequência adequada.</p>'}
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h3 class="font-bold">Registro de Frequência</h3>
        <button onclick="formFrequencia()" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold flex items-center gap-2">

      <div class="flex flex-wrap gap-2 mb-4">

          </thead>
          <tbody>
            ${freqs.sort((a,b)=>parseDate(b.data)-parseDate(a.data)).slice(0,30).map(f=>{

/* ============ ETAPA 3: ENTREGAS E RELATÓRIO PARA OS PAIS ============ */
function tarefaAtribuida(t,a){ return !t.turmaId || t.turmaId===a.turmaId || (t.alunosIds||[]).includes(a.id); }
function alunosDaTarefa(t){ return DB.alunos.all().filter(a=>a.status==='ativo' && tarefaAtribuida(t,a)); }
function tarefasDoAluno(a){
  return DB.tarefas.all().filter(t=>tarefaAtribuida(t,a))
    .sort((x,y)=>(parseDate(y.prazo)||0)-(parseDate(x.prazo)||0));
}
function entregaDe(t,aid){ return (t.entregas||{})[aid] || null; }
function progressoTarefa(t){
  const als = alunosDaTarefa(t);
  const e = t.entregas||{};
  const ent = als.filter(a=>e[a.id] && e[a.id].entregue).length;
  return {total:als.length, ent, pct: als.length ? Math.round(ent/als.length*100) : 0};
}
function trimestreAtual(){ return Math.floor(new Date().getMonth()/4)+1; }

/* ----- Entregas por aluno ----- */
function abrirEntregas(tid){
  const t = DB.tarefas.all().find(x=>x.id===tid); if(!t) return;
  const als = alunosDaTarefa(t);
  const turma = DB.turmas.all().find(x=>x.id===t.turmaId);
  const disc = t.disciplina || (turma && turma.disciplinas && turma.disciplinas[0]) || '';
  const tri = t.trimestre || trimestreAtual();
  const ent = t.entregas||{};
  openModal('Entregas: '+t.titulo, `
    <form id="formEnt" class="space-y-4">
      <p class="text-sm text-slate-500">${turma?esc(turma.nome):'Todas as turmas'} • Prazo: ${fmtDate(t.prazo)}</p>

          <input name="disc" value="${esc(disc)}" placeholder="Ex: Matemática" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
        <div><label class="text-xs font-semibold">Trimestre</label>
          <select name="tri" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
            <option value="1" ${tri===1?'selected':''}>1º</option><option value="2" ${tri===2?'selected':''}>2º</option><option value="3" ${tri===3?'selected':''}>3º</option>
          </select></div>
      </div>
      <div class="flex items-center justify-between">
        <p class="text-sm font-semibold">Alunos <span id="entCont" class="text-emerald-600 ml-1"></span></p>
        <button type="button" id="btnTodosEnt" class="px-3 py-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 text-xs font-semibold">Marcar todos como entregue</button>
      </div>
      <div class="space-y-2 max-h-80 overflow-y-auto">
        ${als.map(a=>{
          const e = ent[a.id];
          const ok = !!(e && e.entregue);
          return `<div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40">
            <label class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
              <input type="checkbox" class="checkbox-custom ent-chk" data-aluno="${a.id}" ${ok?'checked':''}/>
              <span class="font-semibold text-sm truncate">${esc(a.nome)}</span>
            </label>
            <input type="number" step="0.1" min="0" max="10" placeholder="Nota" data-aluno="${a.id}" value="${ok && e.nota!=null ? e.nota : ''}" ${ok?'':'disabled'}
              class="ent-nota w-20 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm disabled:opacity-40"/>
          </div>`;
        }).join('') || '<p class="text-sm text-slate-500 text-center py-4">Nenhum aluno ativo nesta tarefa.</p>'}
      </div>
      <p class="text-xs text-slate-500">A nota é opcional (0 a 10). Quando preenchida, entra no Desempenho do aluno. A tarefa é concluída sozinha quando todos entregam.</p>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold">Cancelar</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold">Salvar entregas</button>
      </div>
    </form>
  `);

  const form = document.getElementById('formEnt');
  const chks = Array.from(form.querySelectorAll('.ent-chk'));
  const notaDe = aid => form.querySelector(`.ent-nota[data-aluno="${aid}"]`);
  const conta = ()=>{ document.getElementById('entCont').textContent = `${chks.filter(c=>c.checked).length}/${chks.length} entregaram`; };
  chks.forEach(c=>c.addEventListener('change',()=>{
    const n = notaDe(c.dataset.aluno);
    n.disabled = !c.checked;
    if(!c.checked) n.value = '';
    conta();
  }));
  document.getElementById('btnTodosEnt').addEventListener('click',()=>{
    chks.forEach(c=>{ c.checked = true; notaDe(c.dataset.aluno).disabled = false; });
    conta();
  });
  conta();

  form.addEventListener('submit',e=>{
    e.preventDefault();
    const dsc = form.querySelector('[name=disc]').value.trim();
    const trim = parseInt(form.querySelector('[name=tri]').value);
    const tarefas = DB.tarefas.all();
    const tt = tarefas.find(x=>x.id===tid);
    if(!tt) return;
    tt.entregas = tt.entregas||{};
    const idsLista = als.map(a=>a.id);
    const notas = DB.notas.all().filter(n=>!(n.tarefaId===tid && idsLista.includes(n.alunoId)));
    let semDisc = false;
    chks.forEach(c=>{
      const aid = c.dataset.aluno;
      const v = parseFloat(notaDe(aid).value);
      const nota = c.checked && !isNaN(v) ? Math.min(10,Math.max(0,v)) : null;
      const prev = tt.entregas[aid];
      if(c.checked) tt.entregas[aid] = {entregue:true, nota, data:(prev && prev.data) || hojeISO()};
      else delete tt.entregas[aid];
      if(nota!==null){
        if(!dsc) semDisc = true;
        notas.push({id:id(),alunoId:aid,disciplina:dsc,tipo:'Trabalho',nota,notaMax:10,trimestre:trim,data:hojeISO(),tarefaId:tid});
      }
    });
    if(semDisc) return toast('Informe a disciplina para lançar as notas.','error');
    tt.disciplina = dsc; tt.trimestre = trim;
    const todos = als.length>0 && als.every(a=>tt.entregas[a.id]);
    if(todos && tt.status==='ativa'){ tt.status='concluida'; tt.concluidaAuto = true; }
    else if(!todos && tt.status==='concluida' && tt.concluidaAuto){ tt.status='ativa'; tt.concluidaAuto = false; }
    if(!DB.notas.save(notas)) return;
    DB.tarefas.save(tarefas);
    closeModal();
    toast(todos ? 'Entregas salvas. Tarefa concluída!' : 'Entregas salvas!');
    refreshPagina();
  });
}

/* ----- Observações do professor (por aluno e período) ----- */
function getObs(aid,key){
  const o = DB.observacoes.all().find(x=>x.alunoId===aid && x.periodo===key);
  return o ? o.obs : '';
}
function setObs(aid,key,txt){
  const lista = DB.observacoes.all();
  const i = lista.findIndex(x=>x.alunoId===aid && x.periodo===key);
  const t = (txt||'').trim();
  if(!t){ if(i>=0) lista.splice(i,1); else return; }
  else if(i>=0) lista[i].obs = t;
  else lista.push({id:id(),alunoId:aid,periodo:key,obs:t});
  DB.observacoes.save(lista);
}

/* ----- Relatório para os pais ----- */
function parsePeriodo(key){
  const p = key.split(':');
  if(p[0]==='m'){
    const [y,m] = p[1].split('-').map(Number);
    return {tipo:'m', key, comp:p[1], label:compLabel(p[1]), txt:'de '+compMes(p[1]), ini:new Date(y,m-1,1), fim:new Date(y,m,0,23,59,59)};
  }
  const y = +p[1], k = +p[2];
  return {tipo:'tri', key, tri:k, ano:y, label:`${k}º trimestre de ${y}`, txt:`do ${k}º trimestre`, ini:new Date(y,(k-1)*4,1), fim:new Date(y,k*4,0,23,59,59)};
}

function dadosRelatorio(a,per){
  const dentro = d=>{ const x = parseDate(d); return !!x && x>=per.ini && x<=per.fim; };
  const norm = n => (+n.nota||0)/(+n.notaMax||10)*10;
  const notas = DB.notas.all().filter(n=>n.alunoId===a.id && (per.tipo==='tri' ? n.trimestre===per.tri : dentro(n.data)));
  const media = notas.length ? notas.reduce((s,n)=>s+norm(n),0)/notas.length : null;
  const disc = {};
  notas.forEach(n=>{ (disc[n.disciplina] = disc[n.disciplina]||[]).push(norm(n)); });
  const porDisc = Object.keys(disc).map(k=>({disciplina:k, media:disc[k].reduce((s,x)=>s+x,0)/disc[k].length, qtd:disc[k].length}));

  const fr = DB.frequencias.all().filter(f=>f.alunoId===a.id && dentro(f.data));
  const pres = fr.filter(f=>f.status==='presente').length;
  const freq = {
    total:fr.length, presentes:pres,
    faltas:fr.filter(f=>f.status==='falta').length,
    justificadas:fr.filter(f=>f.status==='justificada').length,
    pct: fr.length ? pres/fr.length*100 : null
  };

  const tarefas = tarefasDoAluno(a).filter(t=>dentro(t.prazo)).map(t=>{
    const e = entregaDe(t,a.id);
    const entregue = !!(e && e.entregue);
    const st = entregue ? 'Entregue' : t.status==='concluida' ? 'Não entregou' : isVencida(t.prazo) ? 'Atrasada' : 'Pendente';
    return {t, entregue, nota:(e && e.nota!=null) ? e.nota : null, st};
  });

  const ci = compOf(per.ini), cf = compOf(per.fim);
  const itens = DB.mensalidades.all().filter(m=>m.alunoId===a.id && m.competencia>=ci && m.competencia<=cf);
  let finTxt = 'sem mensalidade neste período';
  if(itens.length){
    const abertas = itens.filter(m=>!m.pagoEm);
    finTxt = abertas.length
      ? abertas.map(m=>`${compMes(m.competencia)} ${stMens(m).tipo==='atrasado'?'em atraso':'vence em '+fmtDate(m.vencimento)}`).join('; ')
      : 'em dia';
  }
  return {notas, media, porDisc, freq, tarefas, tTot:tarefas.length, tEnt:tarefas.filter(x=>x.entregue).length, finTxt};
}

function montarMsgRelatorio(a,per,d,obs,incFin){
  const L = [`Olá, ${a.responsavel}! Segue o resumo ${per.txt} do aluno ${a.nome}:`];
  L.push('- Média: ' + (d.media!==null ? d.media.toFixed(1).replace('.',',') : 'sem notas no período'));
  L.push('- Frequência: ' + (d.freq.pct!==null ? Math.round(d.freq.pct)+'%' : 'sem registros no período'));
  L.push('- Tarefas entregues: ' + (d.tTot ? `${d.tEnt} de ${d.tTot}` : 'nenhuma tarefa no período'));
  if(incFin) L.push('- Mensalidade: '+d.finTxt);
  if(obs) L.push('', 'Observação do professor: '+obs);
  L.push('', 'Qualquer dúvida, é só chamar.');
  return L.join('\n');
}

function gerarRelatorioPDF(a,per,d,obs,incFin){
  const t = DB.turmas.all().find(x=>x.id===a.turmaId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18); doc.text('Relatório do Aluno',14,20);
  doc.setFontSize(10); doc.text('EduGestão — Reforço Escolar',14,28);
  doc.setDrawColor(63,107,255); doc.setLineWidth(1); doc.line(14,32,196,32);
  doc.setFontSize(11);
  doc.text(`Aluno: ${a.nome}`,14,42);
  doc.text(`Turma: ${t?t.nome:'—'}`,14,50);
  doc.text(`Responsável: ${a.responsavel}`,14,58);
  doc.text(`Período: ${per.label}`,120,42);
  const mediaTxt = d.media!==null ? d.media.toFixed(1).replace('.',',') : '—';
  const freqTxt = d.freq.pct!==null ? Math.round(d.freq.pct)+'%' : '—';
  const tarTxt = d.tTot ? `${d.tEnt} de ${d.tTot}` : '—';
  doc.text(`Média: ${mediaTxt}     Frequência: ${freqTxt}     Tarefas entregues: ${tarTxt}`,14,70);
  let y = 78;
  if(d.porDisc.length){
    doc.autoTable({startY:y, head:[['Disciplina','Média','Avaliações']],
      body:d.porDisc.map(x=>[x.disciplina,x.media.toFixed(1).replace('.',','),x.qtd]),
      styles:{fontSize:9}, headStyles:{fillColor:[63,107,255]}});
    y = doc.lastAutoTable.finalY + 8;
  }
  if(d.tarefas.length){
    doc.autoTable({startY:y, head:[['Tarefa','Prazo','Situação','Nota']],
      body:d.tarefas.map(x=>[x.t.titulo,fmtDate(x.t.prazo),x.st,x.nota!==null?x.nota.toFixed(1).replace('.',','):'—']),
      styles:{fontSize:9}, headStyles:{fillColor:[63,107,255]}});
    y = doc.lastAutoTable.finalY + 8;
  }
  doc.setFontSize(11);
  if(incFin){
    if(y>270){ doc.addPage(); y = 20; }
    doc.text('Mensalidade: '+d.finTxt,14,y); y += 10;
  }
  if(obs){
    if(y>250){ doc.addPage(); y = 20; }
    doc.setFont(undefined,'bold'); doc.text('Observação do professor',14,y);
    doc.setFont(undefined,'normal'); doc.text(doc.splitTextToSize(obs,180),14,y+7);
  }
  doc.save(`relatorio-${a.nome.replace(/\s/g,'_')}-${per.key.replace(/:/g,'-')}.pdf`);
  toast('Relatório gerado!');
}

      </div>
    </form>
  `);
  const chips = Array.from(document.querySelectorAll('#formT .chip-dia'));
  let tocou = false;
  chips.forEach(c=>c.addEventListener('change',()=>{ tocou = true; }));
  document.querySelector('#formT [name=horario]').addEventListener('input',ev=>{
    if(tocou) return;
    const ds = parseDiasHorario(ev.target.value);
    chips.forEach(c=>{ c.checked = ds.includes(parseInt(c.value)); });
  });
  document.getElementById('formT').addEventListener('submit',e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.dias = chips.filter(c=>c.checked).map(c=>parseInt(c.value));
    data.maxAlunos = parseInt(data.maxAlunos)||10;
    data.disciplinas = data.disciplinas.split(',').map(d=>d.trim()).filter(Boolean);
    const lista = DB.turmas.all();
    if(editId){ const i=lista.findIndex(x=>x.id===editId); lista[i]={...lista[i],...data}; }
    else { data.id=id(); lista.push(data); }
    DB.turmas.save(lista); closeModal(); toast('Turma salva!'); refreshPagina();
  });
}

/* Opções de mensalidade de um aluno: as em aberto + o próximo mês (para adiantar) */
function opcoesMens(aid){
  const ms = DB.mensalidades.all().filter(m=>m.alunoId===aid);
  const abertas = ms.filter(m=>!m.pagoEm).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  const ult = ms.map(m=>m.competencia).sort().pop();
  const prox = ult ? addMes(ult,1) : compAtual();
  const a = DB.alunos.all().find(x=>x.id===aid);
  const opts = abertas.map(m=>({
    v:'m:'+m.id,
    label:`${compLabel(m.competencia)} — ${fmtBRL(m.valor)}${stMens(m).tipo==='atrasado'?' (atrasada)':''}`,
    valor:m.valor
  }));
  opts.push({v:'n:'+prox, label:`Novo mês: ${compLabel(prox)} — ${fmtBRL(a?a.valor:0)}`, valor:a?a.valor:0});
  return opts;
}

  openModal('Registrar pagamento', `

        <div><label class="text-xs font-semibold">Data do pagamento</label>
          <input type="date" name="data" value="${hojeISO()}" required class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>

      <div><label class="text-xs font-semibold">Método</label>
        <div class="grid grid-cols-3 gap-2 mt-1">
          <label class="cursor-pointer"><input type="radio" name="metodo" value="PIX" class="hidden peer" checked/><div class="p-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 peer-checked:border-brand-500 peer-checked:bg-brand-50 dark:peer-checked:bg-brand-900/20 text-center font-semibold text-sm">PIX</div></label>

        <input name="obs" placeholder="Ex: desconto de R$ 20 por indicação" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
      <div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 text-sm">

  const selAluno = form.querySelector('[name=alunoId]');
  const selMens = form.querySelector('[name=mens]');
  const val = form.querySelector('[name=valor]');
  let opts = [];
  const setValor = ()=>{ const o = opts.find(x=>x.v===selMens.value); if(o) val.value = o.valor; };
  const montaMens = ()=>{
    if(!selAluno.value){ opts = []; selMens.innerHTML = '<option value="">Selecione o aluno...</option>'; val.value = ''; return; }
    opts = opcoesMens(selAluno.value);
    selMens.innerHTML = opts.map(o=>`<option value="${o.v}">${o.label}</option>`).join('');

    const quer = document.getElementById('chkRecibo').checked;
    closeModal();
    toast('Pagamento registrado!');
    refreshPagina();
    if(quer) abrirMsgWA(mid,'recibo');
  });
}

function comprovante(pid){
  const p = DB.pagamentos.all().find(x=>x.id===pid); if(!p) return;
  const a = DB.alunos.all().find(x=>x.id===p.alunoId);
  const { jsPDF } = window.jspdf;

  doc.setFontSize(18); doc.text('Comprovante de Pagamento',14,20);

  doc.setDrawColor(63,107,255); doc.setLineWidth(1); doc.line(14,32,196,32);
  let y=42;
  const line=(k,v)=>{doc.setFont(undefined,'bold');doc.text(k+':',14,y);doc.setFont(undefined,'normal');doc.text(String(v),60,y);y+=8;};
  line('Aluno',a?a.nome:'—');

}

function marcarEnviado(cid,aid){
  const hist = DB.comunicados.all();

  if(!c.enviados.includes(aid)) c.enviados.push(aid);
  DB.comunicados.save(hist);
  const el = document.getElementById(`envio-${cid}-${aid}`);
  if(el){
    el.textContent = 'Enviado ✓';
    el.className = 'px-4 py-2 rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 text-sm font-semibold whitespace-nowrap';
  }
  const cont = document.getElementById(`contEnvio-${cid}`);
  if(cont) cont.textContent = `${c.enviados.length}/${c.destinatarios.length} enviados`;
  drawHistCom();
}

/* ============ FINANCEIRO ============ */
let finMes = null, finFiltro = 'todos';

function linhasFin(comp){
  const atual = compAtual();
  const alunos = DB.alunos.all();
  const ordem = {atrasado:0,aberto:1,pago:2};
  return DB.mensalidades.all()
    .filter(m=> m.competencia===comp || (comp===atual && !m.pagoEm && m.competencia<atual))
    .map(m=>({m, a:alunos.find(x=>x.id===m.alunoId), st:stMens(m)}))
    .filter(x=>x.a)
    .sort((x,y)=> (ordem[x.st.tipo]-ordem[y.st.tipo]) || x.m.vencimento.localeCompare(y.m.vencimento));
}
function mudarMes(n){
  finMes = n===0 ? compAtual() : addMes(finMes||compAtual(), n);
  renderFinanceiro(); lucide.createIcons();
}
function setFinFiltro(f){ finFiltro = f; renderFinanceiro(); lucide.createIcons(); }
function gerarMesAtualFin(){

    : 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300';
  const btn = 'px-2.5 py-1.5 rounded-lg text-xs font-semibold inline-flex items-center gap-1';
  let acoes;
  if(st.tipo==='pago'){
    acoes = `
      <button onclick="comprovante('${m.pagamentoId}')" class="${btn} bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300"><i data-lucide="receipt" class="w-3.5 h-3.5"></i> Recibo</button>

      <button onclick="desfazerPagamento('${m.id}')" title="Desfazer pagamento" class="${btn} bg-slate-100 dark:bg-slate-700"><i data-lucide="undo-2" class="w-3.5 h-3.5"></i></button>`;
  } else {
    acoes = `
      <button onclick="registrarPagamento('${a.id}','${m.id}')" class="${btn} gradient-mint text-white"><i data-lucide="check" class="w-3.5 h-3.5"></i> Receber</button>
      <button onclick="abrirMsgWA('${m.id}')" class="${btn} bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> ${st.tipo==='atrasado'?'Cobrar':'Lembrar'}</button>
      <button onclick="delMens('${m.id}')" title="Excluir cobrança" class="${btn} bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`;
  }
  const valorTxt = (st.tipo==='pago' && (+m.valorPago||0)!==(+m.valor||0))

function receitaMes(pags,d){ return pags.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).reduce((s,p)=>s+p.valor,0); }
function receitaAno(pags,d){ return pags.filter(p=>new Date(p.data).getFullYear()===d.getFullYear()).reduce((s,p)=>s+p.valor,0); }
let chartFin;
function drawFinChart(mode){
  const pags = DB.pagamentos.all();
  const hoje = new Date();
  const labels=[], data=[];
  if(mode==='semanal'){
    for(let i=6;i>=0;i--){
      const d = new Date(hoje); d.setDate(hoje.getDate()-i);
      labels.push(d.toLocaleDateString('pt-BR',{weekday:'short'}));
      data.push(pags.filter(p=>new Date(p.data).toDateString()===d.toDateString()).reduce((s,p)=>s+p.valor,0));
    }
  } else if(mode==='mensal'){
    for(let i=29;i>=0;i--){
      const d = new Date(hoje); d.setDate(hoje.getDate()-i);
      labels.push(d.getDate());
      data.push(pags.filter(p=>new Date(p.data).toDateString()===d.toDateString()).reduce((s,p)=>s+p.valor,0));
    }
  } else {
    for(let i=11;i>=0;i--){
      const d = new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));
      data.push(pags.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).reduce((s,p)=>s+p.valor,0));
    }
  }
  const ctx = document.getElementById('chartFin').getContext('2d');
  if(chartFin) chartFin.destroy();
  chartFin = new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Receita',data,borderColor:'#3f6bff',backgroundColor:'rgba(63,107,255,.15)',fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}

/* ===== Mensagens de WhatsApp (lembrete, cobrança, recibo) ===== */
const MSG_TIPOS = {lembrete:'Lembrete de vencimento', cobranca:'Cobrança de atraso', recibo:'Recibo de pagamento'};
function montarMsg(tipo,m,a){
  const mes = compMes(m.competencia);
  const venc = fmtDate(m.vencimento);
  if(tipo==='recibo')
    return `Olá, ${a.responsavel}! Recebemos o pagamento da mensalidade de ${mes} do aluno ${a.nome} (${fmtBRL(m.valorPago||m.valor)}) em ${m.pagoEm?fmtDate(m.pagoEm):fmtDate(new Date())}. Obrigado!`;
  if(tipo==='cobranca')
    return `Olá, ${a.responsavel}! Tudo bem? Passando para avisar que a mensalidade de ${mes} do aluno ${a.nome} (${fmtBRL(m.valor)}) venceu no dia ${venc} e ainda não consta como paga. Se já pagou, é só me enviar o comprovante. Qualquer dúvida, é só chamar.`;
  return `Olá, ${a.responsavel}! Tudo bem? Passando para lembrar que a mensalidade de ${mes} do aluno ${a.nome} (${fmtBRL(m.valor)}) vence no dia ${venc}. Qualquer dúvida, é só chamar.`;
}
function abrirMsgWA(mid,tipoForcado){
  const m = DB.mensalidades.all().find(x=>x.id===mid); if(!m) return;
  const a = DB.alunos.all().find(x=>x.id===m.alunoId); if(!a) return;
  const st = stMens(m);
  const tipo = tipoForcado || (m.pagoEm ? 'recibo' : st.tipo==='atrasado' ? 'cobranca' : 'lembrete');
  openModal('Mensagem para '+a.responsavel, `
    <div class="space-y-4">
      <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40 text-sm">
        <b>${esc(a.nome)}</b> • ${compLabel(m.competencia)} • ${fmtBRL(m.valor)}<br>
        <span class="text-slate-500">Para: ${esc(a.responsavel)} (${esc(a.telefone)})</span>
      </div>
      <div><label class="text-xs font-semibold">Modelo</label>
        <select id="waTipo" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
          ${Object.entries(MSG_TIPOS).map(([k,v])=>`<option value="${k}" ${k===tipo?'selected':''}>${v}</option>`).join('')}
        </select></div>
      <div><label class="text-xs font-semibold">Mensagem (você pode editar antes de enviar)</label>
        <textarea id="waMsg" rows="6" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"></textarea></div>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold">Fechar</button>
        <a id="waLink" href="#" target="_blank" rel="noopener" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold flex items-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> Abrir WhatsApp</a>
      </div>
    </div>
  `);
  const ta = document.getElementById('waMsg');
  const sel = document.getElementById('waTipo');
  const link = document.getElementById('waLink');
  const atualiza = ()=>{ link.href = `https://wa.me/${foneWA(a.telefone)}?text=${encodeURIComponent(ta.value)}`; };
  ta.value = montarMsg(tipo,m,a);
  atualiza();
  sel.addEventListener('change',()=>{ ta.value = montarMsg(sel.value,m,a); atualiza(); });
  ta.addEventListener('input',atualiza);
  link.addEventListener('click',()=>registrarContato(mid,sel.value));
}
function registrarContato(mid,tipo){
  if(tipo==='recibo') return;
  const ms = DB.mensalidades.all();
  const m = ms.find(x=>x.id===mid);
  if(!m) return;
  m.ultimoContato = new Date().toISOString();
  DB.mensalidades.save(ms);
  toast('Mensagem aberta no WhatsApp');
  if(paginaAtual==='financeiro' || paginaAtual==='dashboard') refreshPagina();
}

function relAlunos(fmt){

  });

}
function relFin(fmt){
  const rows = DB.pagamentos.all().map(p=>{
    const a = DB.alunos.all().find(x=>x.id===p.alunoId);
    return [a?a.nome:'—',fmtDateTime(p.data),p.metodo,fmtBRL(p.valor),p.referente||''];
  });

function relTurmas(fmt){
  const alunos = DB.alunos.all();
  const porTurma = {};
  alunos.forEach(a=>porTurma[a.turmaId]=(porTurma[a.turmaId]||0)+1);

function relInad(fmt){

    return a ? [a.nome,a.responsavel,a.telefone,compCurta(m.competencia),fmtBRL(m.valor),fmtDate(m.vencimento),stMens(m).dias+' dias'] : null;
  }).filter(Boolean);

function relMensalidades(fmt){
  const alunos = DB.alunos.all();
  const rows = DB.mensalidades.all().sort((a,b)=>a.competencia.localeCompare(b.competencia)).map(m=>{
    const a = alunos.find(x=>x.id===m.alunoId);
    const st = stMens(m);
    return [a?a.nome:'—',compCurta(m.competencia),fmtDate(m.vencimento),fmtBRL(m.valor),st.texto,m.valorPago!=null?fmtBRL(m.valorPago):'—'];

function relDesemp(fmt){
  const rows = DB.alunos.all().filter(a=>a.status==='ativo').map(a=>{
    const medias = calcularMedias(a.id);
    const discs = Object.keys(medias);
    const mediaGeral = discs.length ? discs.reduce((s,d)=>s+medias[d].media,0)/discs.length : 0;
    return [a.nome, discs.join(', '), mediaGeral.toFixed(1), mediaGeral>=6?'Aprovado':'Reprovado'];
  });
  exportar(fmt,'Desempenho',['Aluno','Disciplinas','Média Geral','Situação'],rows);
}
function relBoletim(fmt){
  const rows = [];
  DB.alunos.all().filter(a=>a.status==='ativo').forEach(a=>{
    const medias = calcularMedias(a.id);
    Object.keys(medias).forEach(d=>{
      const m = medias[d];
      rows.push([a.nome,d,m[1]?m[1].toFixed(1):'—',m[2]?m[2].toFixed(1):'—',m[3]?m[3].toFixed(1):'—',m.media.toFixed(1)]);
    });
  });
  exportar(fmt,'Boletim',['Aluno','Disciplina','1º Trim','2º Trim','3º Trim','Média'],rows);
}
function relFreq(fmt){
  const rows = DB.alunos.all().filter(a=>a.status==='ativo').map(a=>{
    const f = calcularFrequencia(a.id);
    return [a.nome,f.presentes,f.faltas,f.justificadas,f.percentual.toFixed(0)+'%',f.percentual>=75?'Adequada':'Baixa'];
  });
  exportar(fmt,'Frequência',['Aluno','Presentes','Faltas','Justificadas','Frequência','Situação'],rows);
}
function relTarefas(fmt){
  const rows = DB.tarefas.all().map(t=>{
    const turma = DB.turmas.all().find(x=>x.id===t.turmaId);
    const pg = progressoTarefa(t);
    return [t.titulo,turma?turma.nome:'Todas',fmtDate(t.prazo),t.valor+' pts',pg.ent+'/'+pg.total,t.status==='ativa'?'Ativa':'Concluída'];
  });
  exportar(fmt,'Tarefas',['Título','Turma','Prazo','Valor','Entregas','Status'],rows);
}
function relEntregas(fmt){
  const rows = [];
  DB.tarefas.all().forEach(t=>{
    const turma = DB.turmas.all().find(x=>x.id===t.turmaId);
    alunosDaTarefa(t).forEach(a=>{
      const e = entregaDe(t,a.id);
      const ok = !!(e && e.entregue);
      const sit = ok ? 'Entregue' : t.status==='concluida' ? 'Não entregou' : isVencida(t.prazo) ? 'Atrasada' : 'Pendente';
      rows.push([t.titulo,turma?turma.nome:'Todas',a.nome,sit,(ok && e.nota!=null)?e.nota.toFixed(1):'—']);
    });
  });
  exportar(fmt,'Entregas',['Tarefa','Turma','Aluno','Situação','Nota'],rows);
}
function relPortfolio(fmt){
  const rows = DB.portfolios.all().map(p=>{
    const a = DB.alunos.all().find(x=>x.id===p.alunoId);
    return [a?a.nome:'—',p.disciplina,p.tipo,fmtDate(p.data),p.fileName];
  });
  exportar(fmt,'Portfólio',['Aluno','Disciplina','Tipo','Data','Arquivo'],rows);
}
function exportar(fmt,nome,heads,rows){
  if(fmt==='xlsx'){
    const ws = XLSX.utils.aoa_to_sheet([heads,...rows]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,nome);
    XLSX.writeFile(wb,`${nome}.xlsx`);
  } else {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Relatório — '+nome,14,18);
    doc.autoTable({head:[heads],body:rows,startY:25,styles:{fontSize:9}});
    doc.save(`${nome}.pdf`);
  }
  toast('Relatório gerado!');
}

    <div class="space-y-3">
      <input id="buscaGlobal" autocomplete="off" placeholder="Digite o nome do aluno ou do responsável..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/>
      <p id="buscaTitulo" class="text-xs font-semibold text-slate-500"></p>
      <div id="resBusca" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>
  `);
  const inp = document.getElementById('buscaGlobal');
  const res = document.getElementById('resBusca');
  const tit = document.getElementById('buscaTitulo');
  let lista = [];
  const desenha = ()=>{
    const q = normTxt(inp.value.trim());
    const todos = DB.alunos.all();
    if(q){
      lista = todos.filter(a=>normTxt(a.nome).includes(q) || normTxt(a.responsavel).includes(q) || String(a.telefone||'').includes(q)).slice(0,8);
      tit.textContent = lista.length ? 'Resultados' : '';
    } else {
      lista = todos.filter(a=>a.status==='ativo').slice(0,8);
      tit.textContent = lista.length ? 'Alunos ativos' : '';
    }
    res.innerHTML = lista.map(a=>{
      const t = DB.turmas.all().find(x=>x.id===a.turmaId);
      return `<button onclick="verAluno('${a.id}')" class="w-full text-left flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40 hover:bg-brand-50 dark:hover:bg-brand-900/20">
        <div class="w-10 h-10 rounded-full gradient-brand flex items-center justify-center text-white font-bold flex-shrink-0">${esc((a.nome||'?')[0])}</div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-sm truncate">${esc(a.nome)}</p>
          <p class="text-xs text-slate-500 truncate">${t?esc(t.nome):'Sem turma'} • Resp.: ${esc(a.responsavel)}</p>
        </div>
        ${a.status!=='ativo'?'<span class="badge bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300">inativo</span>':''}
      </button>`;
    }).join('') || `<p class="text-sm text-slate-500 text-center py-6">${q?'Nenhum aluno encontrado.':'Nenhum aluno cadastrado.'}</p>`;
    lucide.createIcons();
  };
  inp.addEventListener('input',desenha);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && lista[0]) verAluno(lista[0].id); });
  desenha();
  setTimeout(()=>inp.focus(),50);
}

/* Menu "+ Novo" */
function toggleNovo(ev){
  if(ev) ev.stopPropagation();
  const m = document.getElementById('menuNovo');
  if(m) m.classList.toggle('hidden');
}
function fechaNovo(){
  const m = document.getElementById('menuNovo');
  if(m) m.classList.add('hidden');
}

/* Abre a conversa com o responsável no WhatsApp */
function abrirWhats(aid){
  const a = DB.alunos.all().find(x=>x.id===aid); if(!a) return;
  window.open(`https://wa.me/${foneWA(a.telefone)}`,'_blank','noopener');
}

/* Faixa de atalhos no topo da ficha do aluno */
function faixaFicha(aid){
  const cZap = 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200';
  const cBrand = 'bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 hover:bg-brand-200';
  const cCinza = 'bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600';
  const b = (cor,fn,icone,txt)=>`<button onclick="${fn}" class="px-3 py-2 rounded-xl text-sm font-semibold inline-flex items-center gap-2 ${cor}"><i data-lucide="${icone}" class="w-4 h-4"></i> ${txt}</button>`;
  const atr = DB.mensalidades.all()
    .filter(m=>m.alunoId===aid && !m.pagoEm && stMens(m).tipo==='atrasado')
    .sort((x,y)=>x.vencimento.localeCompare(y.vencimento))[0];
  const banner = atr ? `<div class="flex flex-wrap items-center justify-between gap-3 p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
      <p class="text-sm"><b>Mensalidade atrasada:</b> ${compLabel(atr.competencia)} • ${fmtBRL(atr.valor)} • ${stMens(atr).texto.toLowerCase()}</p>
      ${b(cZap,`abrirMsgWA('${atr.id}')`,'message-circle','Cobrar')}</div>` : '';
  return `${banner}
    <div class="flex flex-wrap gap-2">
      ${b('gradient-mint text-white',`registrarPagamento('${aid}')`,'check','Receber')}
      ${b(cBrand,`formFrequencia('${aid}')`,'calendar-check','Chamada')}
      ${b(cBrand,`formNota('${aid}')`,'clipboard-list','Lançar nota')}
      ${b(cBrand,`relatorioPais('${aid}')`,'file-text','Relatório')}
      ${b(cZap,`abrirWhats('${aid}')`,'message-circle','WhatsApp')}
      ${b(cCinza,`formAluno('${aid}')`,'edit-2','Editar')}
    </div>`;
}

/* Atalhos de teclado: Ctrl+K ou "/" abre a busca; Esc fecha */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); fechaNovo(); return; }
  if((e.ctrlKey||e.metaKey) && String(e.key).toLowerCase()==='k'){ e.preventDefault(); abrirBusca(); return; }
  const tag = ((document.activeElement||{}).tagName||'');
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(tag)){ e.preventDefault(); abrirBusca(); }
});
document.addEventListener('click',()=>fechaNovo());

/* ============ INIT ============ */
migrarPagamentos();
gerarMensalidades();
go('dashboard');
lucide.createIcons();
</script>
