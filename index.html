<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduGestão — Reforço Escolar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50:'#eef4ff',100:'#dbe6ff',200:'#bfd2ff',300:'#93b4ff',
            400:'#6690ff',500:'#3f6bff',600:'#2a4de0',700:'#243db3',
            800:'#22368c',900:'#203270'
          },
          edu: {
            mint:'#7dd3c0',
            peach:'#ffb199',
            lavender:'#c4b5fd',
            sun:'#fcd34d'
          }
        },
        fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{font-family:'Inter',sans-serif}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:8px}
  .dark ::-webkit-scrollbar-thumb{background:#374151}
  .sidebar-link{transition:all .2s}
  .sidebar-link:hover{transform:translateX(4px)}
  .sidebar-link.active{background:linear-gradient(90deg,#3f6bff,#6690ff);color:#fff;box-shadow:0 8px 20px -8px #3f6bff}
  .card-hover{transition:all .25s}
  .card-hover:hover{transform:translateY(-3px);box-shadow:0 20px 40px -15px rgba(63,107,255,.35)}
  .fade-in{animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .modal-backdrop{backdrop-filter:blur(6px)}
  .gradient-brand{background:linear-gradient(135deg,#3f6bff 0%,#6690ff 50%,#c4b5fd 100%)}
  .gradient-mint{background:linear-gradient(135deg,#7dd3c0,#34d399)}
  .gradient-peach{background:linear-gradient(135deg,#ffb199,#f97316)}
  .gradient-lav{background:linear-gradient(135deg,#c4b5fd,#8b5cf6)}
  .gradient-sun{background:linear-gradient(135deg,#fcd34d,#f59e0b)}
  input,select,textarea{outline:none}
  input:focus,select:focus,textarea:focus{border-color:#3f6bff;box-shadow:0 0 0 3px rgba(63,107,255,.15)}
  .badge{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
  .checkbox-custom{width:20px;height:20px;accent-color:#3f6bff}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors">

<!-- ============ LAYOUT ============ -->
<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed lg:static z-40 w-64 h-screen bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-transform -translate-x-full lg:translate-x-0">
    <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl gradient-brand flex items-center justify-center text-white">
        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg">EduGestão</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Reforço Escolar</p>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a data-page="dashboard" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dashboard</span>
      </a>
      <a data-page="alunos" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="users" class="w-5 h-5"></i><span>Alunos</span>
      </a>
      <a data-page="pagamentos" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="credit-card" class="w-5 h-5"></i><span>Pagamentos</span>
      </a>
      <a data-page="turmas" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="book-open" class="w-5 h-5"></i><span>Turmas</span>
      </a>
      <a data-page="comunicados" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="message-circle" class="w-5 h-5"></i><span>Comunicados</span>
      </a>
      <a data-page="financeiro" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="wallet" class="w-5 h-5"></i><span>Financeiro</span>
      </a>
      <a data-page="automacao" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="bot" class="w-5 h-5"></i><span>Automação</span>
      </a>
      <a data-page="relatorios" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
        <i data-lucide="file-bar-chart" class="w-5 h-5"></i><span>Relatórios</span>
      </a>
    </nav>
    <div class="p-4 border-t border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-brand-200 dark:bg-brand-800 flex items-center justify-center font-bold text-brand-700 dark:text-brand-200">AD</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">Administrador</p>
          <p class="text-xs text-slate-500 truncate">admin@edugestao.com</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 min-w-0">
    <!-- TOPBAR -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur border-b border-slate-200 dark:border-slate-700 px-4 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="btnMenu" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <h2 id="pageTitle" class="text-lg lg:text-xl font-bold">Dashboard</h2>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnNotif" class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span id="notifBadge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <button id="btnDark" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700" title="Alternar tema">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
      </div>
    </header>

    <!-- CONTENT -->
    <section id="content" class="p-4 lg:p-8 fade-in"></section>
  </main>
</div>

<!-- ============ MODAL GENÉRICO ============ -->
<div id="modal" class="hidden fixed inset-0 z-50 modal-backdrop bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-5 border-b border-slate-200 dark:border-slate-700">
      <h3 id="modalTitle" class="text-lg font-bold"></h3>
      <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="modalBody" class="p-5"></div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="hidden fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3"></div>

<!-- ============ SCRIPT ============ -->
<script>
/* =========================================================
   CAMADA DE DADOS (simula Firestore — troque por Firebase)
   ========================================================= */
const DB = {
  _get(k){ return JSON.parse(localStorage.getItem('edu_'+k) || '[]'); },
  _set(k,v){ localStorage.setItem('edu_'+k, JSON.stringify(v)); },
  alunos:     { all:()=>DB._get('alunos'),     save:(a)=>DB._set('alunos',a) },
  turmas:     { all:()=>DB._get('turmas'),     save:(a)=>DB._set('turmas',a) },
  pagamentos:  { all:()=>DB._get('pagamentos'), save:(a)=>DB._set('pagamentos',a) },
  comunicados:{ all:()=>DB._get('comunicados'),save:(a)=>DB._set('comunicados',a) },
  config:     { get:()=>JSON.parse(localStorage.getItem('edu_config')||'{}'),
                set:(c)=>localStorage.setItem('edu_config',JSON.stringify(c)) }
};

/* Seed inicial (primeira execução) */
(function seed(){
  if(!localStorage.getItem('edu_seeded')){
    DB.turmas.save([
      {id:id(),nome:'Matemática 6º ano',professor:'Ana Souza',horario:'Seg/Qua 14h',maxAlunos:10},
      {id:id(),nome:'Português 7º ano',professor:'Carlos Lima',horario:'Ter/Qui 15h',maxAlunos:8},
      {id:id(),nome:'Ciências 8º ano',professor:'Julia Ramos',horario:'Sex 16h',maxAlunos:12}
    ]);
    const hoje = new Date();
    const venc1 = new Date(hoje); venc1.setDate(hoje.getDate()+2);
    const venc2 = new Date(hoje); venc2.setDate(hoje.getDate()+10);
    const venc3 = new Date(hoje); venc3.setDate(hoje.getDate()-3);
    DB.alunos.save([
      {id:id(),nome:'Maria Silva',nascimento:'2012-05-14',turmaId:DB.turmas.all()[0].id,horario:'Seg/Qua 14h',responsavel:'Joana Silva',telefone:'5511988887777',valor:250,status:'ativo',dataCadastro:hoje.toISOString(),vencimentoDia:10},
      {id:id(),nome:'Pedro Santos',nascimento:'2011-08-22',turmaId:DB.turmas.all()[0].id,horario:'Seg/Qua 14h',responsavel:'Rita Santos',telefone:'5511977776666',valor:280,status:'ativo',dataCadastro:hoje.toISOString(),vencimentoDia:venc1.getDate()},
      {id:id(),nome:'Lucas Oliveira',nascimento:'2010-03-10',turmaId:DB.turmas.all()[1].id,horario:'Ter/Qui 15h',responsavel:'Paulo Oliveira',telefone:'5511966665555',valor:300,status:'ativo',dataCadastro:hoje.toISOString(),vencimentoDia:venc2.getDate()},
      {id:id(),nome:'Ana Costa',nascimento:'2013-11-30',turmaId:DB.turmas.all()[2].id,horario:'Sex 16h',responsavel:'Márcia Costa',telefone:'5511955554444',valor:220,status:'inativo',dataCadastro:hoje.toISOString(),vencimentoDia:5}
    ]);
    DB.pagamentos.save([
      {id:id(),alunoId:DB.alunos.all()[0].id,valor:250,metodo:'PIX',data:new Date(hoje.getFullYear(),hoje.getMonth(),5).toISOString(),referente:'Mensal'},
      {id:id(),alunoId:DB.alunos.all()[2].id,valor:300,metodo:'Cartão',data:new Date(hoje.getFullYear(),hoje.getMonth(),3).toISOString(),referente:'Mensal'}
    ]);
    localStorage.setItem('edu_seeded','1');
  }
})();

function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtBRL(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(d){ if(!d) return '—'; const x=new Date(d); return x.toLocaleDateString('pt-BR'); }
function fmtDateTime(d){ if(!d) return '—'; const x=new Date(d); return x.toLocaleString('pt-BR'); }

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
const pages = {
  dashboard:   renderDashboard,
  alunos:      renderAlunos,
  pagamentos:   renderPagamentos,
  turmas:      renderTurmas,
  comunicados: renderComunicados,
  financeiro:  renderFinanceiro,
  automacao:   renderAutomacao,
  relatorios:  renderRelatorios
};
const titles = {
  dashboard:'Dashboard',alunos:'Alunos',pagamentos:'Pagamentos',
  turmas:'Turmas',comunicados:'Comunicados',financeiro:'Financeiro',
  automacao:'Automação WhatsApp',relatorios:'Relatórios'
};

function go(page){
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  document.getElementById('pageTitle').textContent = titles[page];
  const c = document.getElementById('content');
  c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in');
  pages[page]();
  if(window.innerWidth<1024) document.getElementById('sidebar').classList.add('-translate-x-full');
  lucide.createIcons();
}
document.querySelectorAll('.sidebar-link').forEach(l=>l.addEventListener('click',()=>go(l.dataset.page)));
document.getElementById('btnMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('-translate-x-full'));

/* Dark mode */
const btnDark = document.getElementById('btnDark');
if(localStorage.getItem('edu_dark')==='1') document.documentElement.classList.add('dark');
btnDark.addEventListener('click',()=>{
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('edu_dark', document.documentElement.classList.contains('dark')?'1':'0');
  lucide.createIcons();
});

/* =========================================================
   MODAL / TOAST
   ========================================================= */
function openModal(title, html){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
  lucide.createIcons();
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
function toast(msg, type='success'){
  const t = document.getElementById('toast');
  const icon = type==='success'?'check-circle':type==='error'?'alert-circle':'info';
  t.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${msg}</span>`;
  t.classList.remove('hidden');
  lucide.createIcons();
  setTimeout(()=>t.classList.add('hidden'),3000);
}

/* =========================================================
   DASHBOARD
   ========================================================= */
let chart1, chart2;
function renderDashboard(){
  const alunos = DB.alunos.all();
  const pag = DB.pagamentos.all();
  const ativos = alunos.filter(a=>a.status==='ativo');
  const inativos = alunos.filter(a=>a.status==='inativo');
  const hoje = new Date();
  const mesAtual = hoje.getMonth(), anoAtual = hoje.getFullYear();
  const vencProx = ativos.filter(a=>{
    const v = new Date(anoAtual, mesAtual, a.vencimentoDia||10);
    const diff = (v-hoje)/(1000*60*60*24);
    return diff>=0 && diff<=5;
  });
  const previsto = ativos.reduce((s,a)=>s+(+a.valor||0),0);
  const recebido = pag.filter(p=>{
    const d = new Date(p.data); return d.getMonth()===mesAtual && d.getFullYear()===anoAtual;
  }).reduce((s,p)=>s+(+p.valor||0),0);

  const html = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard('Total de Alunos', alunos.length, 'users', 'gradient-brand', 'text-white')}
      ${statCard('Ativos', ativos.length, 'user-check', 'gradient-mint', 'text-white')}
      ${statCard('Inativos', inativos.length, 'user-x', 'gradient-peach', 'text-white')}
      ${statCard('Venc. próximos', vencProx.length, 'clock', 'gradient-sun', 'text-white')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold">Pagamentos dos últimos 6 meses</h3>
          <span class="text-xs text-slate-500">Receita mensal</span>
        </div>
        <canvas id="chart1" height="110"></canvas>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">Resumo do mês</h3>
        <div class="space-y-4">
          <div>
            <p class="text-xs text-slate-500">Previsto</p>
            <p class="text-2xl font-bold text-brand-600 dark:text-brand-400">${fmtBRL(previsto)}</p>
          </div>
          <div>
            <p class="text-xs text-slate-500">Recebido</p>
            <p class="text-2xl font-bold text-emerald-600">${fmtBRL(recebido)}</p>
          </div>
          <div>
            <p class="text-xs text-slate-500">A receber</p>
            <p class="text-2xl font-bold text-orange-600">${fmtBRL(Math.max(0,previsto-recebido))}</p>
          </div>
          <div class="pt-3 border-t border-slate-200 dark:border-slate-700">
            <div class="flex justify-between text-sm mb-1"><span>Progresso</span><span>${previsto?Math.round(recebido/previsto*100):0}%</span></div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2"><div class="h-2 rounded-full gradient-brand" style="width:${previsto?Math.min(100,recebido/previsto*100):0}%"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">Últimos pagamentos</h3>
        <div class="space-y-3">
          ${pag.slice().sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,5).map(p=>{
            const a = alunos.find(x=>x.id===p.alunoId);
            return `<div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full gradient-mint flex items-center justify-center text-white"><i data-lucide="check" class="w-4 h-4"></i></div>
                <div>
                  <p class="font-semibold text-sm">${a?a.nome:'—'}</p>
                  <p class="text-xs text-slate-500">${fmtDateTime(p.data)} • ${p.metodo}</p>
                </div>
              </div>
              <span class="font-bold text-emerald-600">${fmtBRL(p.valor)}</span>
            </div>`;
          }).join('') || '<p class="text-sm text-slate-500">Nenhum pagamento registrado.</p>'}
        </div>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-4">⚠️ Vencimentos próximos</h3>
        <div class="space-y-3">
          ${vencProx.map(a=>`<div class="flex items-center justify-between p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800">
            <div>
              <p class="font-semibold text-sm">${a.nome}</p>
              <p class="text-xs text-slate-500">Resp.: ${a.responsavel} • ${fmtBRL(a.valor)}</p>
            </div>
            <span class="badge bg-amber-200 text-amber-900">Dia ${a.vencimentoDia||10}</span>
          </div>`).join('') || '<p class="text-sm text-slate-500">Nenhum vencimento próximo.</p>'}
        </div>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;

  // Gráfico
  const ctx = document.getElementById('chart1').getContext('2d');
  if(chart1) chart1.destroy();
  const labels=[], data=[];
  for(let i=5;i>=0;i--){
    const d = new Date(anoAtual, mesAtual-i, 1);
    labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));
    const total = pag.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()}).reduce((s,p)=>s+p.valor,0);
    data.push(total);
  }
  chart1 = new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{label:'Receita',data,backgroundColor:'#3f6bff',borderRadius:8}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'}},x:{grid:{display:false}}}}
  });
}
function statCard(label,val,icon,grad,text){
  return `<div class="card-hover ${grad} ${text} rounded-2xl p-5 shadow-sm">
    <div class="flex items-center justify-between mb-3"><span class="text-sm opacity-90">${label}</span><i data-lucide="${icon}" class="w-5 h-5"></i></div>
    <p class="text-3xl font-bold">${val}</p>
  </div>`;
}

/* =========================================================
   ALUNOS
   ========================================================= */
function renderAlunos(){
  const alunos = DB.alunos.all();
  const turmas = DB.turmas.all();
  const html = `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
      <div class="flex-1 flex items-center gap-2">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="buscaAluno" placeholder="Buscar aluno..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"/>
        </div>
        <select id="filtroStatus" class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm">
          <option value="">Todos status</option><option value="ativo">Ativos</option><option value="inativo">Inativos</option>
        </select>
      </div>
      <button onclick="formAluno()" class="px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold flex items-center gap-2 shadow-lg shadow-brand-500/30">
        <i data-lucide="user-plus" class="w-4 h-4"></i> Novo aluno
      </button>
    </div>
    <div id="listaAlunos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  `;
  document.getElementById('content').innerHTML = html;
  drawAlunos();
  document.getElementById('buscaAluno').addEventListener('input',drawAlunos);
  document.getElementById('filtroStatus').addEventListener('change',drawAlunos);
}
function drawAlunos(){

function comprovante(pid){
  const p = DB.pagamentos.all().find(x=>x.id===pid); if(!p) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18); doc.text('Comprovante de Pagamento',14,20);
  doc.setFontSize(10); doc.text('EduGestão — Reforço Escolar',14,28);
  doc.setDrawColor(63,107,255); doc.setLineWidth(1); doc.line(14,32,196,32);
  let y=42;
  const line=(k,v)=>{doc.setFont(undefined,'bold');doc.text(k+':',14,y);doc.setFont(undefined,'normal');doc.text(String(v),60,y);y+=8;};
  line('Aluno',a?a.nome:'—');
  line('Responsável',a?a.responsavel:'—');
  line('Valor',fmtBRL(p.valor));
  line('Método',p.metodo);
  line('Data/Hora',fmtDateTime(p.data));
  line('Referente',p.referente||'Mensal');
  line('ID',p.id);
  doc.save(`comprovante-${p.id}.pdf`);
  toast('Comprovante gerado!');
}

        <h3 class="font-bold mb-3">Novo comunicado</h3>
        <div class="mb-3">
          <p class="text-xs font-semibold mb-2">Destinatários</p>
          <div class="flex gap-2 mb-2">
            <button onclick="marcarTodos()" class="px-3 py-1.5 rounded-lg bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300 text-xs font-semibold">Todos</button>
            <button onclick="desmarcarTodos()" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs font-semibold">Limpar</button>
          </div>
          <div id="listaDest" class="max-h-64 overflow-y-auto space-y-1 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
            ${alunos.map(a=>`
              <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/40 cursor-pointer">
                <input type="checkbox" class="checkbox-custom dest" value="${a.id}"/>
                <div class="flex-1">
                  <p class="text-sm font-semibold">☐ ${a.nome}</p>
                  <p class="text-xs text-slate-500">Resp.: ${a.responsavel} • ${a.telefone}</p>
                </div>
              </label>`).join('')}
          </div>
        </div>
        <div><label class="text-xs font-semibold">Mensagem</label>
          <textarea id="msgCom" rows="5" placeholder="Digite a mensagem..." class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"></textarea></div>
        <button onclick="enviarComunicado()" class="mt-3 w-full px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="message-circle" class="w-4 h-4"></i> Enviar pelo WhatsApp</button>
        <p class="text-xs text-slate-500 mt-2">* Integração com API WhatsApp (Z-API/Evolution) pendente — mensagens serão registradas no histórico.</p>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-3">Histórico</h3>
        <div class="space-y-3 max-h-[500px] overflow-y-auto">
          ${hist.map(c=>`<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40">
            <div class="flex justify-between text-xs text-slate-500 mb-1"><span>${fmtDateTime(c.data)}</span><span>${c.destinatarios.length} contatos</span></div>
            <p class="text-sm">${c.mensagem}</p>
          </div>`).join('') || '<p class="text-sm text-slate-500">Nenhum comunicado enviado.</p>'}
        </div>
      </div>
    </div>
  `;
}
function marcarTodos(){ document.querySelectorAll('.dest').forEach(c=>c.checked=true); }
function desmarcarTodos(){ document.querySelectorAll('.dest').forEach(c=>c.checked=false); }
function enviarComunicado(){
  const ids = Array.from(document.querySelectorAll('.dest:checked')).map(c=>c.value);
  const msg = document.getElementById('msgCom').value.trim();
  if(!ids.length) return toast('Selecione ao menos um destinatário','error');
  if(!msg) return toast('Digite a mensagem','error');
  const alunos = DB.alunos.all();
  const destinatarios = ids.map(i=>alunos.find(a=>a.id===i)).filter(Boolean);
  // Simulação: abrir WhatsApp Web para cada responsável
  destinatarios.forEach(a=>{
    const url = `https://wa.me/${a.telefone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
    window.open(url,'_blank');
  });
  const hist = DB.comunicados.all();
  hist.push({id:id(),data:new Date().toISOString(),mensagem:msg,destinatarios:ids});
  DB.comunicados.save(hist);
  toast(`${destinatarios.length} mensagem(ns) disparada(s)!`);
  setTimeout(renderComunicados,500);
}

/* =========================================================
   FINANCEIRO
   ========================================================= */
function renderFinanceiro(){
  const pags = DB.pagamentos.all();
  const alunos = DB.alunos.all();
  const hoje = new Date();
  const inad = alunos.filter(a=>{
    if(a.status!=='ativo') return false;
    const v = new Date(hoje.getFullYear(), hoje.getMonth(), a.vencimentoDia||10);
    return v < hoje && !pags.some(p=>p.alunoId===a.id && new Date(p.data).getMonth()===hoje.getMonth());
  });
  const prox = alunos.filter(a=>{
    if(a.status!=='ativo') return false;
    const v = new Date(hoje.getFullYear(), hoje.getMonth(), a.vencimentoDia||10);
    const diff = (v-hoje)/(1000*60*60*24);
    return diff>=0 && diff<=5;
  });
  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
      ${statCard('Receita do mês',fmtBRL(receitaMes(pags,hoje)),'trending-up','gradient-mint','text-white')}
      ${statCard('Receita do ano',fmtBRL(receitaAno(pags,hoje)),'calendar','gradient-brand','text-white')}
      ${statCard('Inadimplentes',inad.length,'alert-triangle','gradient-peach','text-white')}
      ${statCard('Próx. vencimento',prox.length,'clock','gradient-sun','text-white')}
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 mb-5">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="text-sm font-semibold">Filtro:</span>
        <button data-f="semanal" class="fbtn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-sm">Semanal</button>
        <button data-f="mensal" class="fbtn px-3 py-1.5 rounded-lg bg-brand-500 text-white text-sm">Mensal</button>
        <button data-f="anual" class="fbtn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-sm">Anual</button>
      </div>
      <canvas id="chartFin" height="100"></canvas>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-3">Inadimplentes</h3>
        <div class="space-y-2">
          ${inad.map(a=>`<div class="flex justify-between p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
            <div><p class="font-semibold text-sm">${a.nome}</p><p class="text-xs text-slate-500">${a.responsavel}</p></div>
            <span class="font-bold text-red-600">${fmtBRL(a.valor)}</span>
          </div>`).join('') || '<p class="text-sm text-slate-500">Nenhum inadimplente.</p>'}
        </div>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-3">Próximos ao vencimento</h3>
        <div class="space-y-2">
          ${prox.map(a=>`<div class="flex justify-between p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800">
            <div><p class="font-semibold text-sm">${a.nome}</p><p class="text-xs text-slate-500">Dia ${a.vencimentoDia||10}</p></div>
            <span class="font-bold text-amber-700">${fmtBRL(a.valor)}</span>
          </div>`).join('') || '<p class="text-sm text-slate-500">Nenhum próximo.</p>'}
        </div>
      </div>
    </div>
  `;
  drawFinChart('mensal');
  document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.fbtn').forEach(x=>{x.classList.remove('bg-brand-500','text-white');x.classList.add('bg-slate-100','dark:bg-slate-700');});
    b.classList.add('bg-brand-500','text-white'); b.classList.remove('bg-slate-100','dark:bg-slate-700');
    drawFinChart(b.dataset.f);
  }));
}
function receitaMes(pags,d){ return pags.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).reduce((s,p)=>s+p.valor,0); }
function receitaAno(pags,d){ return pags.filter(p=>new Date(p.data).getFullYear()===d.getFullYear()).reduce((s,p)=>s+p.valor,0); }
let chartFin;
function drawFinChart(mode){
  const pags = DB.pagamentos.all();
  const hoje = new Date();
  const labels=[], data=[];
  if(mode==='semanal'){
    for(let i=6;i>=0;i--){
      const d = new Date(hoje); d.setDate(hoje.getDate()-i);
      labels.push(d.toLocaleDateString('pt-BR',{weekday:'short'}));
      data.push(pags.filter(p=>new Date(p.data).toDateString()===d.toDateString()).reduce((s,p)=>s+p.valor,0));
    }
  } else if(mode==='mensal'){
    for(let i=29;i>=0;i--){
      const d = new Date(hoje); d.setDate(hoje.getDate()-i);
      labels.push(d.getDate());
      data.push(pags.filter(p=>new Date(p.data).toDateString()===d.toDateString()).reduce((s,p)=>s+p.valor,0));
    }
  } else {
    for(let i=11;i>=0;i--){
      const d = new Date(hoje.getFullYear(),hoje.getMonth()-i,1);
      labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));
      data.push(pags.filter(p=>{const x=new Date(p.data);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).reduce((s,p)=>s+p.valor,0));
    }
  }
  const ctx = document.getElementById('chartFin').getContext('2d');
  if(chartFin) chartFin.destroy();
  chartFin = new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Receita',data,borderColor:'#3f6bff',backgroundColor:'rgba(63,107,255,.15)',fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}

/* =========================================================
   AUTOMAÇÃO (preparada para API WhatsApp)
   ========================================================= */
function renderAutomacao(){
  const cfg = DB.config.get();
  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-3">🤖 Configuração da API WhatsApp</h3>
        <p class="text-sm text-slate-500 mb-4">Integração preparada para Z-API, Evolution API ou Twilio.</p>
        <div class="space-y-3">
          <div><label class="text-xs font-semibold">Endpoint da API</label>
            <input id="cfgEndpoint" value="${cfg.endpoint||''}" placeholder="https://api.z-api.io/..." class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
          <div><label class="text-xs font-semibold">Token</label>
            <input id="cfgToken" type="password" value="${cfg.token||''}" class="w-full mt-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"/></div>
          <button onclick="saveCfg()" class="w-full px-5 py-2.5 rounded-xl gradient-brand text-white font-semibold">Salvar configuração</button>
        </div>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
        <h3 class="font-bold mb-3">Fluxo automático</h3>
        <ul class="space-y-3 text-sm">
          <li class="flex gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40"><i data-lucide="bell" class="w-5 h-5 text-amber-500"></i><div><b>3 dias antes do vencimento</b><p class="text-xs text-slate-500">Lembrete automático ao responsável.</p></div></li>
          <li class="flex gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40"><i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i><div><b>No dia do vencimento</b><p class="text-xs text-slate-500">Aviso de pagamento pendente.</p></div></li>
          <li class="flex gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-700/40"><i data-lucide="check-circle" class="w-5 h-5 text-emerald-500"></i><div><b>Após pagamento registrado</b><p class="text-xs text-slate-500">Confirmação automática + atualização do status.</p></div></li>
        </ul>
        <button onclick="simularAutomacao()" class="mt-4 w-full px-5 py-2.5 rounded-xl gradient-mint text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="play" class="w-4 h-4"></i> Simular verificação agora</button>
      </div>
    </div>
  `;
}
function saveCfg(){
  DB.config.set({endpoint:document.getElementById('cfgEndpoint').value,token:document.getElementById('cfgToken').value});
  toast('Configuração salva!');
}
function simularAutomacao(){
  const alunos = DB.alunos.all().filter(a=>a.status==='ativo');
  const hoje = new Date();
  let avisos = 0;
  alunos.forEach(a=>{
    const v = new Date(hoje.getFullYear(), hoje.getMonth(), a.vencimentoDia||10);
    const diff = Math.round((v-hoje)/(1000*60*60*24));
    if(diff===3){ avisos++; console.log('[AUTO] Lembrete 3 dias:',a.nome,a.telefone); }
    else if(diff===0){ avisos++; console.log('[AUTO] Venceu hoje:',a.nome,a.telefone); }
    else if(diff<0){ avisos++; console.log('[AUTO] Atrasado:',a.nome,a.telefone); }
  });
  toast(`Verificação concluída. ${avisos} ação(ões) identificada(s). Veja o console.`);
}

/* =========================================================
   RELATÓRIOS
   ========================================================= */
function renderRelatorios(){
  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      ${relCard('Alunos','Lista completa de alunos cadastrados','users','relAlunos')}
      ${relCard('Financeiro','Receitas, pagamentos e inadimplência','wallet','relFin')}
      ${relCard('Turmas','Ocupação e distribuição de alunos','book-open','relTurmas')}
      ${relCard('Inadimplência','Alunos com pagamento em atraso','alert-triangle','relInad')}
    </div>
  `;
}
function relCard(t,d,icon,fn){
  return `<div class="card-hover bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
    <div class="flex items-center gap-3 mb-3"><div class="w-12 h-12 rounded-xl gradient-brand flex items-center justify-center text-white"><i data-lucide="${icon}" class="w-6 h-6"></i></div><div><h3 class="font-bold">${t}</h3><p class="text-xs text-slate-500">${d}</p></div></div>
    <div class="flex gap-2">
      <button onclick="${fn}('pdf')" class="flex-1 px-3 py-2 rounded-lg bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 text-sm font-semibold flex items-center justify-center gap-1"><i data-lucide="file-text" class="w-4 h-4"></i> PDF</button>
      <button onclick="${fn}('xlsx')" class="flex-1 px-3 py-2 rounded-lg bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 text-sm font-semibold flex items-center justify-center gap-1"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel</button>
    </div>
  </div>`;
}
function relAlunos(fmt){
  const rows = DB.alunos.all().map(a=>{
    const t = DB.turmas.all().find(x=>x.id===a.turmaId);
    return [a.nome,a.responsavel,a.telefone,t?t.nome:'',fmtBRL(a.valor),a.status,fmtDate(a.dataCadastro)];
  });
  exportar(fmt,'Alunos',['Nome','Responsável','Telefone','Turma','Valor','Status','Cadastro'],rows);
}
function relFin(fmt){
  const rows = DB.pagamentos.all().map(p=>{
    const a = DB.alunos.all().find(x=>x.id===p.alunoId);
    return [a?a.nome:'—',fmtDateTime(p.data),p.metodo,fmtBRL(p.valor),p.referente||''];
  });
  exportar(fmt,'Pagamentos',['Aluno','Data','Método','Valor','Referente'],rows);
}
function relTurmas(fmt){
  const alunos = DB.alunos.all();
  const porTurma = {};
  alunos.forEach(a=>porTurma[a.turmaId]=(porTurma[a.turmaId]||0)+1);
  const rows = DB.turmas.all().map(t=>{
    const qtd = porTurma[t.id]||0;
    return [t.nome,t.professor,t.horario,qtd,t.maxAlunos,t.maxAlunos-qtd,Math.round(qtd/t.maxAlunos*100)+'%'];
  });
  exportar(fmt,'Turmas',['Turma','Professor','Horário','Alunos','Máx','Vagas','Ocupação'],rows);
}
function relInad(fmt){
  const hoje = new Date();
  const pags = DB.pagamentos.all();
  const rows = DB.alunos.all().filter(a=>{
    if(a.status!=='ativo') return false;
    const v = new Date(hoje.getFullYear(),hoje.getMonth(),a.vencimentoDia||10);
    return v<hoje && !pags.some(p=>p.alunoId===a.id && new Date(p.data).getMonth()===hoje.getMonth());
  }).map(a=>[a.nome,a.responsavel,a.telefone,fmtBRL(a.valor),'Dia '+a.vencimentoDia]);
  exportar(fmt,'Inadimplentes',['Aluno','Responsável','Telefone','Valor','Vencimento'],rows);
}
function exportar(fmt,nome,heads,rows){
  if(fmt==='xlsx'){
    const ws = XLSX.utils.aoa_to_sheet([heads,...rows]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,nome);
    XLSX.writeFile(wb,`${nome}.xlsx`);
  } else {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Relatório — '+nome,14,18);
    doc.autoTable({head:[heads],body:rows,startY:25,styles:{fontSize:9}});
    doc.save(`${nome}.pdf`);
  }
  toast('Relatório gerado!');
}

/* =========================================================
   INIT
   ========================================================= */
go('dashboard');
lucide.createIcons();
</script>
